/* Modern Reset & Base Setup */
*, *::before, *::after {
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  color: var(--ink);
  background: #f5f2ff;
  -webkit-font-smoothing: antialiased;
}
button {
  font-family: inherit;
  cursor: pointer;
}
input, textarea, select {
  font-family: inherit;
}
a {
  color: inherit;
  text-decoration: none;
}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: rgba(121, 87, 255, 0.2);
  border-radius: 4px;
}
::-webkit-scrollbar-thumb:hover {
  background: rgba(121, 87, 255, 0.4);
}

/* Layout Utilities */
.view-header {
  margin-bottom: 26px;
}
.view-title {
  font-size: clamp(28px, 3.5vw, 44px);
  font-weight: 800;
  font-family: 'Plus Jakarta Sans', sans-serif;
  letter-spacing: -1.5px;
  line-height: 1.15;
  margin: 12px 0 8px;
}
.view-title em {
  font-style: normal;
  color: var(--purple);
}
.view-desc {
  color: var(--muted);
  font-size: 14px;
  max-width: 580px;
  line-height: 1.6;
}

/* Filter Bar & Controls */
.filter-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}
.filter-chips {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.chip {
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.6);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  transition: all 0.18s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.chip:hover {
  background: #fff;
  color: var(--ink);
  border-color: rgba(121, 87, 255, 0.3);
}
.chip.active {
  background: var(--purple);
  color: #fff;
  border-color: var(--purple);
  box-shadow: 0 4px 12px rgba(121, 87, 255, 0.25);
}

/* Full Bucket Grid */
.bucket-page-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

/* Tables & Lists */
.data-table-card {
  overflow-x: auto;
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.66);
  border: 1px solid rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(18px);
  box-shadow: 0 10px 34px rgba(103, 86, 162, 0.05);
}
.data-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 12px;
}
.data-table th {
  padding: 14px 18px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #9893af;
  border-bottom: 1px solid var(--line);
  background: rgba(245, 242, 255, 0.4);
  white-space: nowrap;
}
.data-table td {
  padding: 14px 18px;
  border-bottom: 1px solid rgba(67, 48, 130, 0.05);
  color: var(--ink);
  white-space: nowrap;
}
.data-table tr:last-child td {
  border-bottom: 0;
}
.data-table tr:hover td {
  background: rgba(255, 255, 255, 0.5);
}

/* Grids */
.grid-2 {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}
@media (max-width: 900px) {
  .grid-2, .grid-3 {
    grid-template-columns: 1fr;
  }
}

/* Heatmap for Best Posting Times */
.heatmap-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 8px;
  margin-top: 16px;
}
.heatmap-day {
  text-align: center;
}
.heatmap-day-label {
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  margin-bottom: 6px;
}
.heatmap-cell {
  height: 38px;
  border-radius: 8px;
  display: grid;
  place-items: center;
  font-size: 10px;
  font-weight: 700;
  margin-bottom: 4px;
  transition: transform 0.18s;
  cursor: pointer;
}
.heatmap-cell:hover {
  transform: scale(1.05);
}
.heat-low {
  background: rgba(121, 87, 255, 0.12);
  color: var(--purple);
}
.heat-med {
  background: rgba(121, 87, 255, 0.28);
  color: #4f31d8;
}
.heat-high {
  background: var(--purple);
  color: #fff;
  box-shadow: 0 4px 12px rgba(121, 87, 255, 0.3);
}

/* Templates Cards */
.template-card {
  padding: 20px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.88);
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: all 0.2s;
}
.template-card:hover {
  transform: translateY(-3px);
  background: #fff;
  box-shadow: 0 12px 28px rgba(121, 87, 255, 0.12);
}
.template-tag {
  align-self: flex-start;
  font-size: 9px;
  font-weight: 700;
  padding: 3px 8px;
  border-radius: 6px;
  background: #eee9ff;
  color: var(--purple);
}

/* Connection Cards */
.connection-card {
  padding: 18px 20px;
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.88);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.connection-info {
  display: flex;
  align-items: center;
  gap: 14px;
}
.connection-icon {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 16px;
  flex: none;
}
.conn-ig { background: linear-gradient(135deg, #f09433, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); color: #fff; }
.conn-yt { background: #ff0000; color: #fff; }
.conn-tt { background: #000; color: #fff; }
.conn-sub { background: #ff6719; color: #fff; }
.conn-li { background: #0077b5; color: #fff; }
.conn-th { background: #111; color: #fff; }

/* Switch Toggle */
.toggle-switch {
  position: relative;
  display: inline-block;
  width: 38px;
  height: 22px;
}
.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
}
.toggle-slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #d1c9e4;
  transition: .2s;
  border-radius: 22px;
}
.toggle-slider:before {
  position: absolute;
  content: "";
  height: 16px;
  width: 16px;
  left: 3px;
  bottom: 3px;
  background-color: white;
  transition: .2s;
  border-radius: 50%;
}
input:checked + .toggle-slider {
  background-color: var(--purple);
}
input:checked + .toggle-slider:before {
  transform: translateX(16px);
}

/* Accordion FAQs */
.faq-item {
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid var(--line);
  margin-bottom: 10px;
  overflow: hidden;
  transition: background 0.18s;
}
.faq-question {
  padding: 16px 20px;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  justify-content: space-between;
  align-items: center;
  cursor: pointer;
  user-select: none;
}
.faq-question:hover {
  background: rgba(255, 255, 255, 0.4);
}
.faq-answer {
  padding: 0 20px 18px;
  font-size: 12px;
  line-height: 1.65;
  color: #55506b;
  display: none;
}
.faq-item.open .faq-answer {
  display: block;
}
.faq-item.open .faq-icon {
  transform: rotate(180deg);
}
.faq-icon {
  transition: transform 0.2s;
}

/* Full Calendar Page specifics */
.full-calendar-panel {
  padding: 24px;
}
.large-week {
  margin: 24px 0 20px;
}
.calendar-page-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  min-height: 140px;
}

/* Hashtag Pills */
.tag-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid var(--line);
  padding: 8px 12px;
  border-radius: 10px;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink);
  transition: all 0.18s;
  cursor: pointer;
}
.tag-pill:hover {
  background: #eee9ff;
  border-color: var(--purple);
  color: var(--purple);
  transform: translateY(-2px);
}

/* Media Cards */
.media-card {
  border-radius: 14px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.7);
  border: 1px solid rgba(255, 255, 255, 0.88);
  transition: all 0.2s;
}
.media-card:hover {
  transform: translateY(-3px);
  box-shadow: 0 12px 25px rgba(121, 87, 255, 0.14);
}
.media-preview {
  height: 130px;
  position: relative;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg, #c7b3ff, #f9cde2);
}
.media-info {
  padding: 12px;
}

/* Persona Selector Dropdown & Stacking Isolation */
.topbar {
  position: relative;
  z-index: 1000;
}
.topbar-actions {
  position: relative;
  z-index: 1001;
}
.topbar-actions .relative {
  position: relative;
  z-index: 1002;
}
.persona {
  cursor: pointer;
  transition: all 0.18s;
  user-select: none;
}
.persona:hover, .persona.is-active {
  background: #ffffff;
  border-color: rgba(121, 87, 255, 0.4);
  box-shadow: 0 4px 14px rgba(121, 87, 255, 0.14);
}
.persona-popover,
.notification-popover,
.top-profile-popover {
  position: absolute;
  right: 0;
  top: 45px;
  width: 295px;
  padding: 10px;
  background: #ffffff;
  border: 1px solid var(--line);
  box-shadow: 0 18px 45px rgba(56, 44, 105, 0.18);
  border-radius: 16px;
  z-index: 99999 !important;
  animation: modal-in 0.18s ease;
}
.persona-item-btn {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 11px;
  border-radius: 10px;
  border: 0;
  background: transparent;
  text-align: left;
  cursor: pointer;
  transition: all 0.16s;
  color: var(--ink);
  font-family: inherit;
  margin-bottom: 2px;
}
.persona-item-btn:hover {
  background: #f4f0ff;
  transform: translateX(2px);
}
.persona-item-btn.is-active {
  background: #f1edfe;
}
.persona-icon-badge {
  width: 32px;
  height: 32px;
  border-radius: 9px;
  display: grid;
  place-items: center;
  flex: none;
}
.persona-copy {
  flex: 1 1;
  min-width: 0;
}
.persona-copy strong {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.25;
}
.persona-copy small {
  display: block;
  font-size: 10px;
  color: var(--muted);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.persona-divider {
  height: 1px;
  background: #eeeaf4;
  margin: 7px 4px;
}

    async function addBucketItem(data) {
      if (window.CreatorAPI) {
        const created = await window.CreatorAPI.content.create(data);
        state.bucket.unshift(created);
      } else {
        const newItem = {
          id: "item_" + Date.now(),
          ...data,
          status: data.status || "Draft",
          script: Boolean(data.script),
          caption: Boolean(data.caption),
          date: data.date || "Unscheduled"
        };
        state.bucket.unshift(newItem);
        saveStorage("creatoros-bucket", state.bucket);
      }
      state.modal = null;
      showToast("Added to your content bucket");
      renderApp();
    }

    async function removeBucketItem(idOrIdx) {
      let id = idOrIdx;
      if (typeof idOrIdx === "number") {
        const item = state.bucket[idOrIdx];
        id = item ? (item.id || item.title) : idOrIdx;
      }
      if (window.CreatorAPI) {
        await window.CreatorAPI.content.delete(id);
      }
      state.bucket = state.bucket.filter(i => (i.id !== id && i.title !== id));
      saveStorage("creatoros-bucket", state.bucket);
      showToast("Content removed");
      renderApp();
    }

    async function addCalendarEvent(eventData) {
      if (window.CreatorAPI) {
        const created = await window.CreatorAPI.calendar.create(eventData);
        state.events.push(created);
      } else {
        const ev = { id: "ev_" + Date.now(), ...eventData };
        state.events.push(ev);
        saveStorage("creatoros-events", state.events);
      }
      state.modal = null;
      showToast("Event scheduled in your calendar");
      renderApp();
    }

    async function removeCalendarEvent(id) {
      if (window.CreatorAPI) {
        await window.CreatorAPI.calendar.delete(id);
      }
      state.events = state.events.filter(e => e.id !== id);
      saveStorage("creatoros-events", state.events);
      showToast("Event removed from calendar");
      renderApp();
    }

    async function toggleBucketFlag(idOrIdx, flag) {
      let item = null;
      if (typeof idOrIdx === "number") item = state.bucket[idOrIdx];
      else item = state.bucket.find(i => i.id === idOrIdx);
      if (!item) return;

      item[flag] = !item[flag];
      if (item.script && item.caption) {
        item.status = "Ready for approval";
      } else if (item.script) {
        item.status = "Script added";
      } else {
        item.status = "Draft";
      }

      if (window.CreatorAPI && item.id) {
        await window.CreatorAPI.content.update(item.id, {
          [flag]: item[flag],
          status: item.status
        });
      }
      saveStorage("creatoros-bucket", state.bucket);
      showToast(flag.toUpperCase() + " status updated");
      renderApp();
    }

    async function generateStudio() {
      const topicEl = document.getElementById("studio-topic");
      const platEl = document.getElementById("studio-platform");
      const toneEl = document.getElementById("studio-tone");

      const topic = topicEl ? topicEl.value.trim() : "How I plan a week of content";
      const platform = platEl ? platEl.value : "Instagram Reels";
      const tone = toneEl ? toneEl.value : (state.brandVoice?.tone || "Warm & direct");

      state.studioLoading = true;
      renderApp();

      try {
        if (state.studioTab === "Hashtag Explorer") {
          const res = await (window.OrcaAI ? window.OrcaAI.generateHashtags({ topic, platform }) : { output: "#creatorjourney #behindthescenes #contentstrategy" });
          state.studioOutput = res.output;
        } else if (state.studioTab === "Caption Generator") {
          const res = await (window.OrcaAI ? window.OrcaAI.generateCaption({ topic, platform, tone, userId: state.user?.id }) : { output: "POV: You built an honest system instead. ✨" });
          state.studioOutput = res.output;
        } else if (state.studioTab === "Content Ideas") {
          const res = await (window.OrcaAI ? window.OrcaAI.generateIdeas({ topic, platform, userId: state.user?.id }) : { formattedList: "01 — The 10-minute idea sprint" });
          state.studioOutput = res.formattedList || res.output;
        } else {
          const res = await (window.OrcaAI ? window.OrcaAI.generateScript({ topic, platform, tone, userId: state.user?.id }) : { output: "AI SCRIPT GENERATED FOR: " + topic });
          state.studioOutput = res.output;
        }
        showToast("ORCA AI draft generated");
      } catch (e) {
        state.studioOutput = "Error generating draft: " + e.message;
        showToast("Generation failed");
      } finally {
        state.studioLoading = false;
        renderApp();
      }
    }

    async function sendChat(text) {
      const inputEl = document.getElementById("dash-chat-input");
      const q = (text !== undefined ? text : (inputEl ? inputEl.value : state.chatInput)).trim();
      if (!q) return;

      state.chat.push({ role: "user", text: q });
      state.chatInput = "";
      state.chatLoading = true;
      renderApp();

      try {
        if (window.OrcaAI) {
          const res = await window.OrcaAI.chat({
            message: q,
            context: { activeView: state.active },
            userId: state.user?.id
          });
          state.chat.push({ role: "assistant", text: res.reply });
        } else {
          state.chat.push({
            role: "assistant",
            text: 'Turn “' + q + '” into a 3-part framework: hook with an honest mistake, explain your routine, and offer a downloadable system.'
          });
        }
      } catch (err) {
        state.chat.push({ role: "assistant", text: "I'm having trouble thinking right now. Please try again." });
      } finally {
        state.chatLoading = false;
        renderApp();
        setTimeout(() => {
          const msgs = document.querySelector(".chat-messages");
          if (msgs) msgs.scrollTop = msgs.scrollHeight;
        }, 50);
      }
    }

        resultsHtml += '<div style="font-size:10px; font-weight:700; color:var(--muted); padding:6px 10px;">WORKSPACE PAGES</div>';
        resultsHtml += filteredNav.map(([name, iconName]) => {

          return '<button data-testid="search-result-' + slug + '" onclick="window.CreatorApp.navigate(\'' + name + '\')">'

    function renderToast() {
      let el = document.getElementById("toast-container");

      }
      if (state.toast) {
        el.innerHTML = '<div class="toast" data-testid="toast-message">'
          + iconSvg('check', 16) + ' ' + state.toast
        + '</div>';
      } else {
        el.innerHTML = '';

    // 9. Master Application Assembly
    function renderApp() {
      let viewContent = '';
      switch (state.active) {
        case "Dashboard":
          viewContent = renderDashboard();
          break;
        case "Content Studio":
          viewContent = renderStudioView();
          break;
        case "My Bucket":
          viewContent = renderBucketView();
          break;
        case "Calendar":
          viewContent = renderCalendarView();
          break;
        case "Approvals":
          viewContent = renderApprovalsView();
          break;
        case "Analytics":
          viewContent = renderAnalyticsView();
          break;
        case "Audience Insights":
          viewContent = renderAudienceView();
          break;
        case "Brand Voice":
          viewContent = renderBrandVoiceView();
          break;
        case "Hashtag Explorer":
          viewContent = renderHashtagsView();
          break;
        case "Media Library":
          viewContent = renderMediaLibraryView();
          break;
        case "Templates":
          viewContent = renderTemplatesView();
          break;
        case "Connections":
          viewContent = renderConnectionsView();
          break;
        case "Monetization":
          viewContent = renderMonetizationView();
          break;
        case "Notifications":
          viewContent = renderNotificationsView();
          break;
        case "Settings":
          viewContent = renderSettingsView();
          break;
        case "Help Center":
          viewContent = renderHelpCenterView();
          break;
        default:
          viewContent = renderStudioView();
          break;
      }

      const root = document.getElementById("app");
      const currentSidebar = document.querySelector(".sidebar-scroll");
      const savedScroll = currentSidebar ? currentSidebar.scrollTop : 0;

      root.innerHTML = '<div class="app-shell ' + (state.collapsed ? 'is-collapsed' : '') + '">'
        + renderSidebar()
        + (state.mobileOpen ? '<div class="scrim" onclick="window.CreatorApp.setMobileOpen(false)"></div>' : '')
        + '<main class="main-content">'
          + renderTopbar()
          + '<div class="page-wrap">'
            + viewContent
          + '</div>'
        + '</main>'
        + renderSearchModal()
        + renderModal()
      + '</div>';

      const restoredSidebar = document.querySelector(".sidebar-scroll");
      if (restoredSidebar) {
        restoredSidebar.scrollTop = savedScroll;
      }
    }

    // 10. Expose Public Controller for Event Handlers
    window.CreatorApp = {
      navigate,
      showToast,
      setMobileOpen,
      toggleCollapse: () => setCollapsed(!state.collapsed),
      setSearchOpen,
      setSearch: (val) => { state.search = val; renderApp(); },
      toggleNotifications: () => { state.notifications = !state.notifications; state.profileOpen = false; state.personaOpen = false; renderApp(); },
      toggleProfile: () => { state.profileOpen = !state.profileOpen; state.notifications = false; state.personaOpen = false; renderApp(); },
      togglePersona: (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        state.personaOpen = !state.personaOpen;
        state.notifications = false;
        state.profileOpen = false;
        renderApp();
      },
      closePopovers: () => { state.notifications = false; state.profileOpen = false; state.personaOpen = false; renderApp(); },
      switchPersona: async (personaKey, routeUrl) => {
        state.personaOpen = false;
        renderApp();
        if (personaKey === "content_creator") {
          showToast("Already inside Content Creator workspace");
          return;
        }
        showToast("Opening workspace...");
        try {
          localStorage.setItem("creatoros_persona", personaKey);
          if (window.CreatorAuth && state.user && state.user.id !== "test_user") {
            const client = window.CreatorAuth.getClient ? window.CreatorAuth.getClient() : null;
            if (client) {
              await client.from("profiles").update({ selected_persona: personaKey }).eq("id", state.user.id);
            }
          }
        } catch (e) {}
        setTimeout(() => {
          window.location.href = routeUrl;
        }, 150);
      },
      openQuestionnaire: () => {
        state.personaOpen = false;
        renderApp();
        window.location.href = 'persona.html?switch=true&retake=true';
      },
      setModal,
      setSelectedDate: (d) => { state.selectedDate = d; renderApp(); },
      setWeekOffset: (offset) => { state.weekOffset = offset; renderApp(); },
      setTipIndex: (idx) => { state.tipIndex = idx; renderApp(); },
      setChatInput: (val) => { state.chatInput = val; },
      sendChat,
      clearChat: () => {
        state.chat = [];
        showToast("Conversation cleared");
        renderApp();
      },
      setStudioTab: (tab) => {
        state.studioTab = tab;
        state.studioOutput = "";
        renderApp();
      },
      generateStudio,
      copyStudioOutput: () => {
        if (state.studioOutput) {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(state.studioOutput).catch(() => {});
          }
          showToast("Copied to clipboard");
        }
      },
      saveStudioToBucket: async () => {
        const topicEl = document.getElementById("studio-topic");
        const platEl = document.getElementById("studio-platform");
        const title = (topicEl ? topicEl.value.trim() : state.studioTopic) || "Generated Draft";
        const platform = (platEl ? platEl.value : "Instagram Reels").split(" ")[0];
        
        await addBucketItem({
          title: title,
          platform: platform,
          status: "Script added",
          script: true,
          caption: false,
          scriptContent: state.studioOutput,
          notes: "Generated with ORCA AI Studio"
        });
        showToast("Draft saved to My Bucket pipeline");
        navigate("My Bucket");
      },
      saveBrandVoice: async () => {
        const toneEl = document.getElementById("studio-tone-input");
        const prefsEl = document.getElementById("studio-prefs-input");
        const audEl = document.getElementById("studio-audience-input");
        const banEl = document.getElementById("studio-banned-input");

        const voiceData = {
          tone: toneEl ? toneEl.value.trim() : state.brandVoice.tone,
          preferences: prefsEl ? prefsEl.value.trim() : state.brandVoice.preferences,
          targetAudience: audEl ? audEl.value.trim() : state.brandVoice.targetAudience,
          bannedWords: banEl ? banEl.value.trim() : state.brandVoice.bannedWords
        };

        if (window.CreatorAPI) {
          await window.CreatorAPI.brandVoice.save(voiceData);
        }
        state.brandVoice = { ...state.brandVoice, ...voiceData };
        showToast("Brand Voice saved to ORCA RAG memory");
        renderApp();
      },
      openEditBucket: (id) => {
        const item = state.bucket.find(i => (i.id === id || i.title === id));
        if (item) setModal("edit-bucket", item);
      },
      removeBucketItem,
      removeCalendarEvent,
      toggleBucketFlag,
      setBucketFilterPlatform: (p) => {
        state.bucketFilterPlatform = p;
        renderApp();
      },
      setBucketSearch: (q) => {
        state.bucketSearch = q;
        renderApp();
      },
      approvePost: async (idOrIdx) => {
        let item = null;
        if (typeof idOrIdx === "number") item = state.bucket[idOrIdx];
        else item = state.bucket.find(i => (i.id === idOrIdx || i.title === idOrIdx));

        if (item) {
          item.status = "Approved";
          if (window.CreatorAPI && item.id) {
            await window.CreatorAPI.approvals.approve(item.id);
          }
          // Also schedule an event if not yet on calendar
          await addCalendarEvent({
            title: item.title,
            platform: item.platform,
            date: "2024-06-20",
            time: "09:30",
            notes: "Approved content piece"
          });
          showToast("Post approved and scheduled in Calendar");
          renderApp();
        }
      },
      requestEdit: async (idOrIdx) => {
        let item = null;
        if (typeof idOrIdx === "number") item = state.bucket[idOrIdx];
        else item = state.bucket.find(i => (i.id === idOrIdx || i.title === idOrIdx));

        if (item) {
          item.status = "Draft";
          if (window.CreatorAPI && item.id) {
            await window.CreatorAPI.approvals.requestEdit(item.id, "Please refine the hook retention.");
          }
          showToast("Revision requested and moved to Draft");
          renderApp();
        }
      },
      setMediaTab: (t) => {
        state.mediaTab = t;
        renderApp();
      },
      removeAsset: async (id) => {
        if (window.CreatorAPI) {
          await window.CreatorAPI.media.delete(id);
        }
        state.media = state.media.filter(m => m.id !== id && m.title !== id);
        showToast("Asset removed from library");
        renderApp();
      },
      useTemplate: async (presetTopic, templateTitle) => {
        state.active = "Content Studio";
        state.studioTab = "Script Writer";
        state.studioTopic = presetTopic;
        state.studioLoading = true;
        renderApp();

        try {
          if (window.OrcaAI) {
            const res = await window.OrcaAI.generateScript({
              topic: presetTopic,
              platform: "Instagram Reels",
              tone: state.brandVoice?.tone || "Warm & direct"
            });
            state.studioOutput = res.output;
          } else {
            state.studioOutput = "AI TEMPLATE OUTLINE FOR: " + presetTopic;
          }
        } catch (e) {
          state.studioOutput = "Template loaded: " + presetTopic;
        } finally {
          state.studioLoading = false;
          renderApp();
          showToast("Template loaded into Content Studio");
        }
      },
      toggleConnection: async (name, connected) => {
        if (window.CreatorAPI) {
          await window.CreatorAPI.connections.toggle(name, connected);
        }
        if (!state.connections) state.connections = {};
        state.connections[name] = connected;
        showToast((connected ? "Connected to " : "Disconnected from ") + name);
      },
      toggleFaq: (idx) => {
        state.faqOpenIndex = state.faqOpenIndex === idx ? -1 : idx;
        renderApp();
      },
      markAllNotificationsRead: async () => {
        if (window.CreatorAPI) {
          await window.CreatorAPI.notifications.markAllRead();
        }
        if (state.notificationsList) {
          state.notificationsList.forEach(n => n.read = true);
        }
        showToast("All notifications marked as read");
        renderApp();
      },
      saveSettings: async () => {
        const nameEl = document.getElementById("settings-display-name");
        const newName = nameEl ? nameEl.value.trim() : state.displayName;
        if (newName) {
          state.displayName = newName;
          if (window.CreatorAuth && state.user) {
            const client = window.CreatorAuth.getClient();
            if (client) {
              await client.from("profiles").update({ display_name: newName }).eq("id", state.user.id);
            }
          }
          showToast("Profile settings updated");
          renderApp();
        }
      },
      submitModal: async () => {
        const mode = state.modal;
        if (mode === "bucket") {
          const titleEl = document.getElementById("modal-title");
          const platEl = document.getElementById("modal-platform");
          const notesEl = document.getElementById("modal-notes");

          const title = titleEl ? titleEl.value.trim() : "";
          if (!title) {
            showToast("Add a title first");
            return;
          }

          await addBucketItem({
            title: title,
            platform: platEl ? platEl.value : "Instagram",
            notes: notesEl ? notesEl.value : ""
          });
        } else if (mode === "edit-bucket" && state.editingItem) {
          const title = document.getElementById("edit-modal-title")?.value.trim() || state.editingItem.title;
          const platform = document.getElementById("edit-modal-platform")?.value || state.editingItem.platform;
          const status = document.getElementById("edit-modal-status")?.value || state.editingItem.status;
          const notes = document.getElementById("edit-modal-notes")?.value || "";
          const scriptContent = document.getElementById("edit-modal-script")?.value || "";
          const captionContent = document.getElementById("edit-modal-caption")?.value || "";

          const patch = { title, platform, status, notes, scriptContent, captionContent };
          if (window.CreatorAPI && state.editingItem.id) {
            await window.CreatorAPI.content.update(state.editingItem.id, patch);
          }
          const idx = state.bucket.findIndex(i => i.id === state.editingItem.id);
          if (idx !== -1) {
            state.bucket[idx] = { ...state.bucket[idx], ...patch };
          }
          state.modal = null;
          state.editingItem = null;
          showToast("Pipeline item updated");
          renderApp();
        } else if (mode === "event") {
          const titleEl = document.getElementById("modal-title");
          const dateEl = document.getElementById("modal-date");
          const timeEl = document.getElementById("modal-time");
          const platEl = document.getElementById("modal-platform");

          const title = titleEl ? titleEl.value.trim() : "";
          const date = dateEl ? dateEl.value : "";
          if (!title || !date) {
            showToast("Add a title and date first");
            return;
          }

          await addCalendarEvent({
            title: title,
            date: date,
            time: timeEl ? timeEl.value : "09:30",
            platform: platEl ? platEl.value : "Instagram"
          });
        } else if (mode === "media") {
          const titleEl = document.getElementById("modal-media-title");
          const tagEl = document.getElementById("modal-media-tag");
          const durEl = document.getElementById("modal-media-dur");

          const title = titleEl ? titleEl.value.trim() : "";
          if (!title) {
            showToast("Enter asset name first");
            return;
          }

          if (window.CreatorAPI) {
            const asset = await window.CreatorAPI.media.upload({
              title: title,
              tag: tagEl ? tagEl.value : "Video Clips",
              dur: durEl ? durEl.value : "12 MB"
            });
            state.media.unshift(asset);
          }
          state.modal = null;
          showToast("Asset added to Media Library");
          renderApp();
        } else if (mode === "deal") {
          const sponsorEl = document.getElementById("modal-deal-sponsor");
          const delivEl = document.getElementById("modal-deal-deliv");
          const feeEl = document.getElementById("modal-deal-fee");
          const dueEl = document.getElementById("modal-deal-due");

          const sponsor = sponsorEl ? sponsorEl.value.trim() : "";
          if (!sponsor) {
            showToast("Enter brand partner name first");
            return;
          }

          if (window.CreatorAPI) {
            const deal = await window.CreatorAPI.monetization.create({
              sponsor: sponsor,
              deliverable: delivEl ? delivEl.value : "1x Integration",
              fee: feeEl ? feeEl.value : "$2,000",
              status: "Contract Review",
              dueDate: dueEl ? dueEl.value : "Next Month"
            });
            state.sponsors.unshift(deal);
          }
          state.modal = null;
          showToast("Campaign deal added");
          renderApp();
        }
      },
      resetDemo: async () => {
        if (window.CreatorAPI) {
          await window.CreatorAPI.resetUserWorkspace();
        }
        localStorage.removeItem("creatoros-bucket");
        localStorage.removeItem("creatoros-events");
        state.bucket = JSON.parse(JSON.stringify(starterBucket));
        state.events = [];
        state.active = "Dashboard";
        state.profileOpen = false;
        state.notifications = false;
        state.personaOpen = false;
        showToast("Demo reset to default state");
        renderApp();
      }
    };

    // Close popovers when clicking outside
    document.addEventListener("click", (e) => {
      const isPopover = e.target.closest(".popover") || e.target.closest(".persona-popover");
      const isNotifBtn = e.target.closest('[data-testid="notifications-button"]');
      const isAvatarBtn = e.target.closest('[data-testid="top-profile-avatar"]') || e.target.closest('.profile .icon-button');
      const isPersonaBtn = e.target.closest('[data-testid="persona-selector"]');
      if (!isPopover && !isNotifBtn && !isAvatarBtn && !isPersonaBtn) {
        if (state.notifications || state.profileOpen || state.personaOpen) {
          state.notifications = false;
          state.profileOpen = false;
          state.personaOpen = false;
          renderApp();
        }
      }
    });

    // Initialize application and load user scoped data
    async function initApp() {
      if (window.CreatorAuth) {
        const isStandalone = new URLSearchParams(window.location.search).get('test_mode') === 'standalone';
        if (!isStandalone) {
          const authResult = await window.CreatorAuth.requireAuth({ expectedPersona: 'content_creator', requireOnboarding: true });
          if (!authResult) return;
          state.user = authResult.user;
          state.displayName = (authResult.profile && authResult.profile.display_name) || (authResult.user.email ? authResult.user.email.split('@')[0] : 'Content Creator');
          state.userEmail = authResult.user.email || 'creator@creatoros.ai';
        } else {
          state.user = { id: 'test_user', email: 'test@creatoros.ai' };
          state.displayName = 'Test Creator';
          state.userEmail = 'test@creatoros.ai';
        }
      }

      // Load user-scoped collections via CreatorAPI
      if (window.CreatorAPI) {
        try {
          state.bucket = await window.CreatorAPI.content.list();
          state.events = await window.CreatorAPI.calendar.list();
          state.media = await window.CreatorAPI.media.list();
          state.connections = await window.CreatorAPI.connections.get();
          state.sponsors = await window.CreatorAPI.monetization.list();
          state.brandVoice = await window.CreatorAPI.brandVoice.get();
          state.notificationsList = await window.CreatorAPI.notifications.list();
        } catch (e) {
          console.warn("[CreatorOS] Could not load all remote collections:", e);
        }
      }

      renderApp();
    }

    if (document.readyState === "complete" || document.readyState === "interactive") {
      initApp();
    } else {
      document.addEventListener("DOMContentLoaded", initApp);
    }
  })();
  </script>
</body>
</html>
