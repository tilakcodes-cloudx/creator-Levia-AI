<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - Cosmic Night</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Dynamic Starfield Background Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Ambient Cosmic Dust & Glow Effects -->
  <div class="cosmic-glow cosmic-glow-top"></div>
  <div class="cosmic-glow cosmic-glow-bottom"></div>

  <main class="page-container">
    <div class="login-card">
      <!-- Header with Title and Shooting Star -->
      <header class="card-header">
        <div class="title-wrapper">
          <h1 class="page-title" id="formTitle">Sign In</h1>
          <!-- Shooting star streak replicating the template reference -->
          <div class="shooting-star-streak" aria-hidden="true"></div>
        </div>
      </header>

      <!-- Main Login Form -->
      <form id="authForm" class="auth-form" autocomplete="on" novalidate>
        <!-- Email Input Group -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="name@example.com" 
              required
              autocomplete="email"
            >
          </div>
          <span class="field-error" id="emailError" role="alert"></span>
        </div>

        <!-- Password Input Group -->
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <div class="input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password" 
              class="form-input password-input" 
              placeholder="••••••••••••" 
              required
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="passwordToggle" 
              aria-label="Toggle password visibility"
              title="Show / Hide Password"
            >
              <!-- Eye Outline SVG -->
              <svg class="eye-icon eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
              <!-- Eye Slash SVG (hidden by default) -->
              <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M9.88 9.88a3 3 0 1 0 4.24 4.24" />
                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />
                <path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61" />
                <line x1="2" y1="2" x2="22" y2="22" />
              </svg>
            </button>
          </div>
          <span class="field-error" id="passwordError" role="alert"></span>
        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="remember-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe" class="custom-checkbox">
            <span class="checkbox-visual" aria-hidden="true">
              <svg class="checkmark-icon" viewBox="0 0 14 14" fill="none">
                <path d="M3 7.5L5.5 10L11 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="remember-text">Remember me</span>
          </label>

          <a href="#forgot" class="forgot-link" id="forgotPasswordLink">Forget Password ?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <div class="btn-loader" aria-hidden="true"></div>
        </button>
      </form>

      <!-- Sign Up Prompt -->
      <footer class="card-footer">
        <p class="signup-prompt">
          Don’t Have an Account ? 
          <a href="#signup" class="signup-link" id="toggleAuthMode">Sign Up</a>
        </p>

        <!-- Divider Line -->
        <div class="divider" aria-hidden="true"></div>

        <!-- Social & Alternative Login Row (5 icons) -->
        <div class="social-login-group">
          <!-- 1. Google -->
          <button type="button" class="social-btn" aria-label="Sign in with Google" title="Google">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#FFFFFF"/>
              <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#FFFFFF" fill-opacity="0.9"/>
              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FFFFFF" fill-opacity="0.85"/>
              <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#FFFFFF"/>
            </svg>
          </button>

          <!-- 2. GitHub -->
          <button type="button" class="social-btn" aria-label="Sign in with GitHub" title="GitHub">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
            </svg>
          </button>

          <!-- 3. Facebook -->
          <button type="button" class="social-btn" aria-label="Sign in with Facebook" title="Facebook">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
            </svg>
          </button>

          <!-- 4. Windows / Microsoft -->
          <button type="button" class="social-btn" aria-label="Sign in with Microsoft" title="Microsoft">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
              <rect x="2.5" y="2.5" width="8.8" height="8.8" rx="1.2" />
              <rect x="12.7" y="2.5" width="8.8" height="8.8" rx="1.2" />
              <rect x="2.5" y="12.7" width="8.8" height="8.8" rx="1.2" />
              <rect x="12.7" y="12.7" width="8.8" height="8.8" rx="1.2" />
            </svg>
          </button>

          <!-- 5. Passkey / Security Key -->
          <button type="button" class="social-btn" aria-label="Sign in with Passkey or Security Key" title="Passkey">
            <svg class="social-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="8" cy="8" r="5" />
              <path d="m11.5 11.5 9.5 9.5" />
              <path d="m16 16 2 2" />
              <path d="m18 14 3 3" />
            </svg>
          </button>
        </div>
      </footer>
    </div>
  </main>

  <!-- Interactive Feedback Toast -->
  <div id="toastNotification" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
