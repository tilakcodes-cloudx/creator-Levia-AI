<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CreatorOS — Sign In</title>
  <meta name="description" content="Sign in to your CreatorOS workspace." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="signin.css">

  <style>
    /* Additional helper styles for display name and configuration banner */
    .field-hidden {
      display: none !important;
    }
    .auth-alert {
      display: none;
      margin-bottom: 16px;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.35);
      color: #fca5a5;
    }
    .auth-alert.visible {
      display: block;
    }
    .auth-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.35);
      color: #6ee7b7;
    }
    .config-banner {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px dashed rgba(255, 255, 255, 0.15);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }
    .config-banner button {
      background: none;
      border: none;
      color: #7dd3fc;
      cursor: pointer;
      font-size: 12px;
      text-decoration: underline;
      padding: 0 4px;
    }
    .config-modal-back {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .config-modal-back.open {
      display: flex;
    }
    .config-card {
      width: 100%;
      max-width: 440px;
      background: #0f1322;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      padding: 28px;
      color: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }
    .config-card h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .config-card p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 18px;
      line-height: 1.45;
    }
    .config-card .form-group {
      margin-bottom: 14px;
    }
    .config-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .config-actions button {
      flex: 1;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
    .config-btn-save {
      background: #7957ff;
      color: #fff;
      border-color: #7957ff !important;
    }
    .config-btn-close {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
    }
  </style>

    <!-- UNIVERSAL UIVERSE.IO WIFI LOADER & SKELETON SCREEN -->
    <style id="universalLoaderStyle">
      #wifi-loader {
        --background: #62abff;
        --front-color: #7957FF;
        --back-color: rgba(121, 87, 255, 0.18);
        --text-color: #F1F5F9;
        width: 64px;
        height: 64px;
        border-radius: 50px;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #wifi-loader svg {
        position: absolute;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      #wifi-loader svg circle {
        position: absolute;
        fill: none;
        stroke-width: 6px;
        stroke-linecap: round;
        stroke-linejoin: round;
        transform: rotate(-100deg);
        transform-origin: center;
      }
      #wifi-loader svg circle.back {
        stroke: var(--back-color);
      }
      #wifi-loader svg circle.front {
        stroke: var(--front-color);
      }
      #wifi-loader svg.circle-outer {
        height: 86px;
        width: 86px;
      }
      #wifi-loader svg.circle-outer circle {
        stroke-dasharray: 62.75 188.25;
      }
      #wifi-loader svg.circle-outer circle.back {
        animation: circle-outer135 1.8s ease infinite 0.3s;
      }
      #wifi-loader svg.circle-outer circle.front {
        animation: circle-outer135 1.8s ease infinite 0.15s;
      }
      #wifi-loader svg.circle-middle {
        height: 60px;
        width: 60px;
      }
      #wifi-loader svg.circle-middle circle {
        stroke-dasharray: 42.5 127.5;
      }
      #wifi-loader svg.circle-middle circle.back {
        animation: circle-middle6123 1.8s ease infinite 0.25s;
      }
      #wifi-loader svg.circle-middle circle.front {
        animation: circle-middle6123 1.8s ease infinite 0.1s;
      }
      #wifi-loader svg.circle-inner {
        height: 34px;
        width: 34px;
      }
      #wifi-loader svg.circle-inner circle {
        stroke-dasharray: 22 66;
      }
      #wifi-loader svg.circle-inner circle.back {
        animation: circle-inner162 1.8s ease infinite 0.2s;
      }
      #wifi-loader svg.circle-inner circle.front {
        animation: circle-inner162 1.8s ease infinite 0.05s;
      }
      #wifi-loader .text {
        position: absolute;
        bottom: -46px;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-color);
        white-space: nowrap;
      }
      #wifi-loader .text::before {
        content: attr(data-text);
      }
      @keyframes circle-outer135 {
        0% { stroke-dashoffset: 251; }
        50% { stroke-dashoffset: 62.75; }
        100% { stroke-dashoffset: -188.25; }
      }
      @keyframes circle-middle6123 {
        0% { stroke-dashoffset: 170; }
        50% { stroke-dashoffset: 42.5; }
        100% { stroke-dashoffset: -127.5; }
      }
      @keyframes circle-inner162 {
        0% { stroke-dashoffset: 88; }
        50% { stroke-dashoffset: 22; }
        100% { stroke-dashoffset: -66; }
      }
      .top-loader {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        z-index: 1000000;
        pointer-events: none;
        background: rgba(112,69,245,.08);
        overflow: hidden;
        transition: opacity .4s ease;
      }
      .top-loader.loaded {
        opacity: 0;
      }
      .top-loader-bar {
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #7957FF 35%, #A56BFF 70%, #25B982 100%);
        border-radius: 99px;
        animation: topLoaderSlide 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        box-shadow: 0 0 12px rgba(121,87,255,.6);
      }
      @keyframes topLoaderSlide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(300%); }
      }
      .skeleton-screen-overlay {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: rgba(9, 9, 15, 0.96);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
        padding: 30px;
      }
      .skeleton-screen-overlay.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .skeleton-center-wrap {
        margin-bottom: 44px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .skeleton-grid-preview {
        width: 100%;
        max-width: 1100px;
        display: flex;
        flex-direction: column;
        gap: 18px;
        opacity: 0.45;
      }
      .skel-row, .skel-card, .skel-panel {
        border-radius: 16px;
        background: linear-gradient(100deg, rgba(121,87,255,.05) 30%, rgba(169,231,111,.14) 50%, rgba(121,87,255,.05) 70%);
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite ease-in-out;
        border: 1px solid rgba(255,255,255,.08);
      }
      @keyframes shimmer {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
      }
      .skel-cards-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
      .skel-panels-row {
        display: flex;
        gap: 18px;
      }
      @media (max-width: 860px) {
        .skel-cards-row { grid-template-columns: repeat(2, 1fr); }
        .skel-panels-row { flex-direction: column; }
      }
    </style>
  
</head>
<body>

  <!-- UNIVERSAL UIVERSE.IO WIFI LOADER & SKELETON SCREEN -->
  <div class="top-loader" id="topLoader"><div class="top-loader-bar"></div></div>
  <div class="skeleton-screen-overlay" id="skeletonScreen">
    <div class="skeleton-center-wrap">
      <div id="wifi-loader">
        <svg class="circle-outer" viewBox="0 0 86 86">
          <circle class="back" cx="43" cy="43" r="40"></circle>
          <circle class="front" cx="43" cy="43" r="40"></circle>
          <circle class="new" cx="43" cy="43" r="40"></circle>
        </svg>
        <svg class="circle-middle" viewBox="0 0 60 60">
          <circle class="back" cx="30" cy="30" r="27"></circle>
          <circle class="front" cx="30" cy="30" r="27"></circle>
        </svg>
        <svg class="circle-inner" viewBox="0 0 34 34">
          <circle class="back" cx="17" cy="17" r="14"></circle>
          <circle class="front" cx="17" cy="17" r="14"></circle>
        </svg>
        <div class="text" data-text="Loading CreatorOS..."></div>
      </div>
    </div>
    <div class="skeleton-grid-preview">
      <div class="skel-row" style="height: 100px; border-radius: 18px;"></div>
      <div class="skel-cards-row">
        <div class="skel-card" style="height: 120px;"></div>
        <div class="skel-card" style="height: 120px;"></div>
        <div class="skel-card" style="height: 120px;"></div>
        <div class="skel-card" style="height: 120px;"></div>
      </div>
      <div class="skel-panels-row">
        <div class="skel-panel" style="height: 250px; flex: 1.5;"></div>
        <div class="skel-panel" style="height: 250px; flex: 1;"></div>
      </div>
    </div>
  </div>

  <script id="universalLoaderScript">
    (function() {
      function dismissUniversalLoader() {
        var skel = document.getElementById('skeletonScreen');
        var topL = document.getElementById('topLoader');
        if (skel) skel.classList.add('loaded');
        if (topL) topL.classList.add('loaded');
        setTimeout(function() {
          if (skel) skel.style.display = 'none';
          if (topL) topL.style.display = 'none';
        }, 400);
      }
      if (document.readyState === 'complete') {
        setTimeout(dismissUniversalLoader, 650);
      } else {
        window.addEventListener('load', function() {
          setTimeout(dismissUniversalLoader, 650);
        });
        setTimeout(dismissUniversalLoader, 2000);
      }
    })();
  </script>
  

  <!-- Dynamic Starfield Background Canvas -->
  <canvas id="starfield"></canvas>

  <!-- Ambient Cosmic Dust & Glow Effects -->
  <div class="cosmic-glow cosmic-glow-top"></div>
  <div class="cosmic-glow cosmic-glow-bottom"></div>

  <main class="page-container">
    <div class="login-card">
      <!-- Header with Title and Shooting Star -->
      <header class="card-header">
        <div class="title-wrapper">
          <h1 class="page-title" id="formTitle">Sign In</h1>
          <!-- Shooting star streak replicating the template reference -->
          <div class="shooting-star-streak" aria-hidden="true"></div>
        </div>
      </header>

      <!-- Auth Alert Banner -->
      <div id="authAlert" class="auth-alert" role="alert"></div>

      <!-- Main Login / Sign Up Form -->
      <form id="authForm" class="auth-form" autocomplete="on" novalidate>
        <!-- Display Name Input Group (Shown only in Sign Up mode) -->
        <div class="form-group field-hidden" id="displayNameGroup">
          <label for="displayName" class="form-label">Full Name</label>
          <div class="input-wrapper">
            <input 
              type="text" 
              id="displayName" 
              name="displayName"

              placeholder="Maya Chen" 
              autocomplete="name"
            >

        </div>

        <!-- Email Input Group -->
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <div class="input-wrapper">

              type="email" 
              id="email" 
              name="email" 
              class="form-input" 
              placeholder="name@example.com"

            >

          <span class="field-error" id="emailError" role="alert"></span>

        <!-- Password Input Group -->

          <label for="password" class="form-label">Password</label>

              <svg class="eye-icon eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="display: none;">

                <path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68" />

        </div>

        <!-- Options: Remember Me & Forgot Password -->
        <div class="form-options">
          <label class="remember-label" for="rememberMe">
            <input type="checkbox" id="rememberMe" name="rememberMe" class="custom-checkbox" checked>
            <span class="checkbox-visual" aria-hidden="true">
              <svg class="checkmark-icon" viewBox="0 0 14 14" fill="none">
                <path d="M3 7.5L5.5 10L11 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </span>
            <span class="remember-text">Remember me</span>
          </label>

          <a href="#forgot" class="forgot-link" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="submit-btn" id="submitBtn">
          <span class="btn-text">Sign In</span>
          <div class="btn-loader" aria-hidden="true"></div>
        </button>
      </form>

      <!-- Sign Up / In Switcher -->
      <footer class="card-footer">
        <p class="signup-prompt">
          Don’t Have an Account ? 
          <a href="#signup" class="signup-link" id="toggleAuthMode">Sign Up</a>
        </p>

        <!-- Divider Line -->
        <div class="divider" aria-hidden="true"></div>

        <!-- Social & Alternative Login Row (5 icons) -->

              <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FFFFFF" fill-opacity="0.85"/>

            </svg>
          </button>

          <!-- 2. GitHub -->
          <button type="button" class="social-btn" aria-label="Sign in with GitHub" title="GitHub (Coming Soon)" data-provider="GitHub">

        <!-- Supabase Configuration Indicator -->
        <div class="config-banner" id="configBanner">

  </main>

  <!-- Supabase Credentials Configuration Modal -->
  <div class="config-modal-back" id="configModal">

      <h2>Supabase Configuration</h2>
      <p>Configure your Supabase Project URL and Anon/Publishable Key for real database authentication.</p>
      
      <div class="form-group">
        <label for="cfgUrl" class="form-label">Project URL</label>
        <div class="input-wrapper">
          <input type="text" id="cfgUrl" class="form-input" placeholder="https://xyzcompany.supabase.co">
        </div>
      </div>

      <div class="form-group">
        <label for="cfgKey" class="form-label">Anon / Publishable Key</label>
        <div class="input-wrapper">
          <input type="password" id="cfgKey" class="form-input" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
        </div>
      </div>

      <div class="config-actions">
        <button type="button" class="config-btn-close" id="closeConfigBtn">Cancel</button>
        <button type="button" class="config-btn-save" id="saveConfigBtn">Save & Connect</button>
      </div>
    </div>
  </div>

    }
  </script>

  <!-- Sign In Page Logic & Starfield Engine -->
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      // -------------------------------------------------------------
      // 1. DYNAMIC STARFIELD CANVAS ENGINE
      // -------------------------------------------------------------
      const canvas = document.getElementById("starfield");
      const ctx = canvas.getContext("2d");

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);
      let dpr = window.devicePixelRatio || 1;

      const STAR_COUNT = Math.max(120, Math.floor((width * height) / 4500));
      const stars = [];

      const starColors = [
        "rgba(255, 255, 255, ",
        "rgba(224, 238, 255, ",
        "rgba(195, 222, 255, ",
        "rgba(255, 246, 228, "
      ];

      class Star {
        constructor() {
          this.reset();
        }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = (Math.random() * 1.4 + 0.5) * (dpr > 1 ? 0.95 : 1);
          this.baseAlpha = Math.random() * 0.25 + 0.25;
          this.alpha = this.baseAlpha;
          this.color = starColors[Math.floor(Math.random() * starColors.length)];
          this.layer = Math.random() * 0.5 + 0.5;
          this.drawX = this.x;
          this.drawY = this.y;
        }
        update(mouseOffsetX, mouseOffsetY) {
          this.drawX = this.x + mouseOffsetX * this.layer;
          this.drawY = this.y + mouseOffsetY * this.layer;
        }
        draw(customAlpha = null) {
          const renderAlpha = customAlpha !== null ? customAlpha : this.alpha;
          ctx.beginPath();
          ctx.arc(this.drawX, this.drawY, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color + renderAlpha + ")";
          ctx.fill();
        }
      }

      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push(new Star());
      }

      let mouseX = 0;
      let mouseY = 0;
      let targetMouseX = 0;
      let targetMouseY = 0;

      window.addEventListener("mousemove", (e) => {
        targetMouseX = (e.clientX - width / 2) * 0.035;
        targetMouseY = (e.clientY - height / 2) * 0.035;
      });

      function animate() {
        mouseX += (targetMouseX - mouseX) * 0.05;
        mouseY += (targetMouseY - mouseY) * 0.05;

        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < stars.length; i++) {
          stars[i].update(mouseX, mouseY);
          stars[i].draw();
        }

        requestAnimationFrame(animate);
      }
      requestAnimationFrame(animate);

      window.addEventListener("resize", () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      // -------------------------------------------------------------
      // 2. CHECK EXISTING ACTIVE SESSION
      // -------------------------------------------------------------
      const authAlert = document.getElementById("authAlert");

      function showAlert(msg, isSuccess = false) {
        authAlert.textContent = msg;
        authAlert.className = "auth-alert visible" + (isSuccess ? " success" : "");
      }
      function hideAlert() {
        authAlert.className = "auth-alert";
        authAlert.textContent = "";
      }

      // If already logged in, redirect to index.html
      const { user } = await CreatorAuth.getSession();
      if (user) {
        showAlert("Active session detected. Loading your workspace...", true);
        setTimeout(() => {
          window.location.href = "index.html";
        }, 300);
        return;
      }

      // Update Supabase configuration status in UI
      const configStatusText = document.getElementById("configStatusText");
      function updateConfigIndicator() {
        const cfg = CreatorAuth.getConfig();
        if (cfg.isConfigured) {
          configStatusText.textContent = "Supabase Auth: Connected (" + cfg.url.replace(/https?:\/\//, '').split('.')[0] + ")";
        } else {
          configStatusText.textContent = "Supabase Auth: Unconfigured (Check supabase-config.js)";
        }
      }
      updateConfigIndicator();

      // Config Modal handlers
      const configModal = document.getElementById("configModal");
      const openConfigBtn = document.getElementById("openConfigBtn");
      const closeConfigBtn = document.getElementById("closeConfigBtn");
      const saveConfigBtn = document.getElementById("saveConfigBtn");
      const cfgUrlInput = document.getElementById("cfgUrl");
      const cfgKeyInput = document.getElementById("cfgKey");

      openConfigBtn.addEventListener("click", () => {
        const cur = CreatorAuth.getConfig();
        cfgUrlInput.value = cur.url;
        cfgKeyInput.value = "";
        configModal.classList.add("open");
      });

      closeConfigBtn.addEventListener("click", () => {
        configModal.classList.remove("open");
      });

      saveConfigBtn.addEventListener("click", () => {
        const url = cfgUrlInput.value.trim();
        const key = cfgKeyInput.value.trim();
        CreatorAuth.setConfig(url, key);
        updateConfigIndicator();
        configModal.classList.remove("open");
        showToast("Supabase credentials saved.");
      });

      // -------------------------------------------------------------
      // 3. PASSWORD VISIBILITY TOGGLE
      // -------------------------------------------------------------
      const passwordInput = document.getElementById("password");
      const passwordToggle = document.getElementById("passwordToggle");
      const eyeOpenIcon = passwordToggle.querySelector(".eye-open");
      const eyeClosedIcon = passwordToggle.querySelector(".eye-closed");

      passwordToggle.addEventListener("click", () => {
        const isPassword = passwordInput.getAttribute("type") === "password";
        passwordInput.setAttribute("type", isPassword ? "text" : "password");
        eyeOpenIcon.style.display = isPassword ? "none" : "block";
        eyeClosedIcon.style.display = isPassword ? "block" : "none";
      });

      // -------------------------------------------------------------
      // 4. SIGN IN / SIGN UP MODE TOGGLE
      // -------------------------------------------------------------
      const authForm = document.getElementById("authForm");
      const emailInput = document.getElementById("email");
      const displayNameInput = document.getElementById("displayName");
      const displayNameGroup = document.getElementById("displayNameGroup");
      const emailError = document.getElementById("emailError");
      const passwordError = document.getElementById("passwordError");
      const submitBtn = document.getElementById("submitBtn");
      const formTitle = document.getElementById("formTitle");
      const toggleAuthMode = document.getElementById("toggleAuthMode");
      const forgotPasswordLink = document.getElementById("forgotPasswordLink");

      let isSignUpMode = false;

      function clearErrors() {
        emailInput.classList.remove("has-error");
        passwordInput.classList.remove("has-error");
        emailError.textContent = "";
        passwordError.textContent = "";
        hideAlert();
      }

      toggleAuthMode.addEventListener("click", (e) => {
        e.preventDefault();
        isSignUpMode = !isSignUpMode;
        clearErrors();

        const promptText = toggleAuthMode.parentElement;
        const btnText = submitBtn.querySelector(".btn-text");

        if (isSignUpMode) {
          formTitle.textContent = "Sign Up";
          document.title = "CreatorOS — Create Account";
          btnText.textContent = "Create Account";
          displayNameGroup.classList.remove("field-hidden");
          promptText.childNodes[0].nodeValue = "Already Have an Account ? ";
          toggleAuthMode.textContent = "Sign In";
          forgotPasswordLink.style.visibility = "hidden";
        } else {
          formTitle.textContent = "Sign In";
          document.title = "CreatorOS — Sign In";
          btnText.textContent = "Sign In";
          displayNameGroup.classList.add("field-hidden");
          promptText.childNodes[0].nodeValue = "Don’t Have an Account ? ";
          toggleAuthMode.textContent = "Sign Up";
          forgotPasswordLink.style.visibility = "visible";
        }
      });

      // -------------------------------------------------------------
      // 5. FORM SUBMISSION (AUTHENTICATION FLOW)
      // -------------------------------------------------------------
      function validateEmail(val) {
        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val);
      }

      authForm.addEventListener("submit", async (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const displayName = displayNameInput.value.trim();
        let hasError = false;

        if (!email) {
          emailInput.classList.add("has-error");
          emailError.textContent = "Please enter your email address.";
          hasError = true;
        } else if (!validateEmail(email)) {
          emailInput.classList.add("has-error");
          emailError.textContent = "Please enter a valid email format (name@example.com).";
          hasError = true;
        }

        if (!password) {
          passwordInput.classList.add("has-error");
          passwordError.textContent = "Please enter your password.";
          hasError = true;
        } else if (password.length < 6) {
          passwordInput.classList.add("has-error");
          passwordError.textContent = "Password must be at least 6 characters.";
          hasError = true;
        }

        if (hasError) return;

        submitBtn.classList.add("loading");
        submitBtn.disabled = true;

        try {
          if (isSignUpMode) {
            // REAL SIGN UP
            if (!CreatorAuth.isConfigured()) {
              showAlert("Supabase credentials missing. Please configure supabase-config.js with your project URL and publishable key.");
              return;
            }

            const data = await CreatorAuth.signUp(email, password, displayName);
            
            // Check if Supabase requires email confirmation
            if (data && data.user && (!data.session || !data.user.confirmed_at)) {
              showAlert("Account created! Please check your email inbox (" + email + ") for the confirmation link before signing in.", true);
              setTimeout(() => {
                toggleAuthMode.click();
              }, 3000);
            } else {
              showAlert("Account created successfully! Directing to persona setup...", true);
              setTimeout(() => {
                window.location.href = "persona.html";
              }, 600);
            }

          } else {
            // REAL SIGN IN
            if (!CreatorAuth.isConfigured()) {
              showAlert("Supabase credentials missing. Please configure supabase-config.js with your project URL and publishable key.");
              return;
            }

            const data = await CreatorAuth.signIn(email, password);
            showAlert("Signed in successfully! Loading workspace...", true);

            // Fetch user profile from Supabase
            const profile = await CreatorAuth.getUserProfile(data.user.id);

            setTimeout(() => {
              if (!profile || !profile.onboarding_completed || !profile.selected_persona) {
                window.location.href = "persona.html";
              } else {
                window.location.href = "index.html";
              }
            }, 500);
          }
        } catch (err) {
          showAlert(err.message || "Authentication failed. Please try again.");
        } finally {
          submitBtn.classList.remove("loading");
          submitBtn.disabled = false;
        }
      });

      // Forgot password handler
      forgotPasswordLink.addEventListener("click", async (e) => {
        e.preventDefault();
        clearErrors();

        const email = emailInput.value.trim();
        if (!email) {
          emailInput.classList.add("has-error");
          emailError.textContent = "Please enter your email address to receive password reset instructions.";
          showAlert("Please enter your email address in the field above first.");
          emailInput.focus();
          return;
        }

        if (!validateEmail(email)) {
          emailInput.classList.add("has-error");
          emailError.textContent = "Please enter a valid email format (e.g., name@example.com).";
          showAlert("Please enter a valid email address.");
          emailInput.focus();
          return;
        }

        if (!CreatorAuth.isConfigured()) {
          showAlert("Supabase credentials missing. Please configure supabase-config.js before requesting password reset.");
          return;
        }

        const originalText = forgotPasswordLink.textContent;
        forgotPasswordLink.textContent = "Sending...";
        forgotPasswordLink.style.pointerEvents = "none";
        showAlert("Sending password recovery link to " + email + "...", true);

        try {
          await CreatorAuth.resetPassword(email);
          showAlert("If an account exists for " + email + ", password reset instructions have been sent. Please check your inbox and spam folder.", true);
        } catch (err) {
          console.error("[CreatorOS Auth] Password reset error:", err);
          if (err.message && err.message.toLowerCase().includes("rate limit")) {
            showAlert("Email rate limit exceeded. Please wait a few minutes before requesting another reset email.");
          } else if (err.message && err.message.toLowerCase().includes("network")) {
            showAlert("Network connection error. Please check your internet connection.");
          } else {
            showAlert(err.message || "Unable to send password recovery email. Please try again.");
          }
        } finally {
          forgotPasswordLink.textContent = originalText;
          forgotPasswordLink.style.pointerEvents = "auto";
        }
      });

      // Toast Notification Helper
      const toast = document.getElementById("toastNotification");
      let toastTimeout = null;
      function showToast(message) {
        if (toastTimeout) clearTimeout(toastTimeout);
        toast.textContent = message;
        toast.classList.add("show");
        toastTimeout = setTimeout(() => {
          toast.classList.remove("show");
        }, 3200);
      }

      // Social button placeholders with explicit coming-soon feedback
      document.querySelectorAll(".social-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const provider = btn.getAttribute("data-provider") || btn.getAttribute("title") || "OAuth Provider";
          showAlert(`${provider} authentication is coming in an upcoming release. Please sign in with your email & password.`);
          showToast(`${provider} OAuth is currently in development.`);
        });
      });
    });
  </script>
</body>
</html>
