<!doctype html>
<html lang="en">
  <head>







    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#09090c" />
    <meta name="description" content="CreatorOS AI — your cinematic, local-first advertising agency workspace. A self-contained demo for campaigns, creatives and collaboration." />
    <title>CreatorOS AI — Agency Workspace</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Cpath d='m20 3 15 8v18l-15 8-15-8V11zm0 0v17m-15-9 15 9 15-9m-15 9v17' fill='none' stroke='%23ff9a32' stroke-width='2.5'/%3E%3C/svg%3E" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #09090c;
        --panel: #171519;
        --secondary: #211b1a;
        --accent: #ff9a32;
        --accent-hot: #ff6a24;
        --gold: #ffc36b;
        --text: #f8f5f1;
        --muted: #a49a95;
        --success: #32c88a;
        --warning: #eab04d;
        --danger: #ff6262;
        --line: rgba(255, 235, 214, .1);
        --sidebar: 218px;
        font-family: "Avenir Next", "Segoe UI", Helvetica, sans-serif;
        font-size: 14px;
        font-synthesis: none;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); }
      button, input, textarea, select { font: inherit; }
      button, a, input, textarea, select { -webkit-tap-highlight-color: transparent; }
      button { color: inherit; cursor: pointer; }
      button:disabled { opacity: .55; cursor: wait; }
      button, input, textarea, select { outline-offset: 4px; }
      :focus-visible { outline: 2px solid var(--accent); }
      a { color: var(--gold); }
      h1, h2, h3, p { margin: 0; }
      h1, h2, h3 { font-weight: 600; letter-spacing: -.035em; }
      h1 { font-size: clamp(26px, 2.8vw, 42px); line-height: 1.2; }
      h2 { font-size: 17px; letter-spacing: -.02em; }
      h3 { font-size: 15px; }
      svg { flex-shrink: 0; vertical-align: middle; }
      .icon { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.65; stroke-linecap: round; stroke-linejoin: round; }
      .muted { color: var(--muted); }
      .small { font-size: 12px; }
      .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: .25em; color: #c8bfb5; }
      .gold { color: var(--gold); }
      .row { display: flex; align-items: center; gap: 10px; }
      .between { justify-content: space-between; }
      .wrap { flex-wrap: wrap; }
      .stack { display: grid; gap: 18px; }
      .icon-button { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border: 1px solid transparent; border-radius: 10px; background: transparent; transition: background .2s, border-color .2s, transform .2s; }
      .icon-button:hover { background: #ffffff0a; border-color: var(--line); transform: translateY(-1px); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 10px 16px; border: 1px solid #ffffff15; border-radius: 10px; background: #ffffff06; font-weight: 500; font-size: 12px; transition: background .2s, transform .2s, box-shadow .2s; }
      .btn:hover { background: #ffffff0e; transform: translateY(-1px); }
      .btn.primary { color: #221208; border-color: #ffcf8280; background: linear-gradient(105deg, #ffcc7b, #ff9a32 65%, #ff7a28); box-shadow: 0 3px 16px #ff7a2820, inset 0 1px 0 #fff6; font-weight: 650; }
      .btn.primary:hover { box-shadow: 0 4px 24px #ff8c3540; }
      .btn.danger { color: #ff8989; border-color: #ff626240; background: #ff62620b; }
      .text-button { display: inline-flex; align-items: center; gap: 6px; padding: 5px 0; border: 0; background: none; color: var(--gold); font-size: 12px; white-space: nowrap; }
      .text-button:hover { color: white; }
      .badge { display: inline-flex; align-items: center; gap: 5px; padding: 5px 9px; border-radius: 6px; background: #ffffff08; color: #c4bcb7; border: 1px solid #ffffff06; font-size: 10px; font-weight: 500; white-space: nowrap; }
      .badge.green { color: #6fe2b1; background: #32c88a13; border-color: #32c88a15; }
      .badge.amber { color: #f3c06d; background: #eab04d13; border-color: #eab04d15; }
      .badge.red { color: #ff9696; background: #ff626213; border-color: #ff626215; }
      .badge.blue { color: #9fbdff; background: #819fff12; }
      .demo-badge { border: 1px solid #ff9a322b; background: #ff9a3209; color: #dba965; letter-spacing: .1em; font-size: 9px; padding: 5px 8px; border-radius: 5px; white-space: nowrap; }
      .panel { position: relative; background: linear-gradient(120deg, #1a181cbd, #121215e8); border: 1px solid var(--line); border-radius: 18px; box-shadow: inset 0 1px 0 #ffffff05, 0 9px 30px #00000012; overflow: hidden; }
      .panel-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
      .panel-title { display: flex; align-items: center; gap: 10px; }
      .panel-title > .icon { color: var(--gold); filter: drop-shadow(0 0 7px #ff9a3255); }
      .panel-padding { padding: 22px; }
      .sidebar {
        position: fixed;
        top: 0;
        bottom: 0;
        left: 0;
        width: var(--sidebar);
        padding: 27px 17px 18px;
        border-right: 1px solid var(--line);
        background: #0c0c0ff5;
        z-index: 40;
        display: flex;
        flex-direction: column;
        transition: width .25s, transform .25s;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: #443224 transparent;
      }
      .sidebar > * {
        flex-shrink: 0;
      }
      .approval-card .thumb img,
      .approval-card .thumb video {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      .sidebar::after { content: ""; position: absolute; width: 310px; height: 240px; bottom: 30px; left: -240px; background: radial-gradient(ellipse, #ff8c3522, transparent 70%); pointer-events: none; }
      .brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; font-size: 19px; font-weight: 650; letter-spacing: -.05em; white-space: nowrap; }
      .brand > .icon { width: 31px; height: 31px; color: var(--accent); filter: drop-shadow(0 0 10px #ff9a3225); }
      .brand em { font-size: 10px; font-style: normal; padding: 2px 3px; border: 1px solid #ff9a3230; color: var(--gold); margin-left: 2px; letter-spacing: 0; }
      .workspace { width: 100%; margin: 34px 0 23px; padding: 12px; border: 1px solid #ffffff07; border-radius: 11px; background: #ffffff06; display: flex; align-items: center; gap: 11px; text-align: left; }
      .workspace > .icon:first-child { color: var(--gold); }
      .workspace .icon:last-child { margin-left: auto; width: 15px; }
      .nav-list { display: grid; gap: 7px; }
      .nav-item { position: relative; display: flex; gap: 15px; align-items: center; width: 100%; border: 1px solid transparent; border-radius: 11px; background: none; padding: 13px 15px; color: #bdb7b4; text-align: left; font-size: 12px; white-space: nowrap; transition: background .2s, color .2s, border-color .2s; }
      .nav-item:hover { background: #ffffff05; color: white; }
      .nav-item.active { border-color: #ffab3b25; color: #fff2df; background: linear-gradient(95deg, #e8903d30, #db89320a); box-shadow: inset 2px 0 0 #ffa94b, 0 0 18px #ff962b07; }
      .nav-item.active .icon { color: #ffd29a; filter: drop-shadow(0 0 7px #ff9a3240); }
      .nav-count { margin-left: auto; font-size: 9px; color: #eab775; border: 1px solid #ffffff0a; background: #ffffff05; padding: 2px 5px; border-radius: 4px; }
      .nav-secondary { border-top: 1px solid var(--line); margin-top: 23px; padding-top: 17px; }
      .sidebar-bottom { position: relative; margin-top: auto; padding-top: 26px; z-index: 1; }
      .sidebar-footer { display: flex; align-items: center; justify-content: space-between; margin: 15px 8px 0; font-size: 9px; letter-spacing: .1em; color: #6b6562; }
      .app { margin-left: var(--sidebar); min-height: 100vh; position: relative; transition: margin-left .25s; }
      .app::after { content: ""; position: fixed; bottom: -180px; right: -70px; width: 600px; height: 300px; pointer-events: none; background: radial-gradient(ellipse, #d4661510, transparent 68%); z-index: -1; }
      .topbar { height: 83px; padding: 19px 30px; display: flex; align-items: center; justify-content: space-between; gap: 20px; position: relative; z-index: 35; }
      .search-wrap { position: relative; width: min(520px, 58%); }
      .search { display: flex; align-items: center; gap: 12px; height: 42px; padding: 0 15px; border: 1px solid #ffffff13; border-radius: 12px; background: linear-gradient(100deg, #1a191d, #141417); box-shadow: inset 0 1px 0 #ffffff04; }
      .search .icon { color: #b3b0ae; width: 18px; }
      .search input { width: 100%; min-width: 0; padding: 0; background: transparent; border: none; color: var(--text); font-size: 12px; outline: none; }
      .search input::placeholder { color: #888481; }
      kbd { display: flex; align-items: center; gap: 7px; font: inherit; color: #bab5b0; font-size: 10px; background: #ffffff05; border: 1px solid #ffffff07; border-radius: 4px; padding: 4px 6px; white-space: nowrap; }
      .header-actions { display: flex; align-items: center; gap: 18px; }
      .notification-button { position: relative; }
      .unread { position: absolute; top: 0; right: 0; display: flex; align-items: center; justify-content: center; min-width: 13px; height: 13px; border-radius: 5px; background: var(--accent); color: #271807; font-size: 8px; font-weight: 700; box-shadow: 0 0 10px #ff9a3230; }
      .avatar { display: flex; align-items: center; justify-content: center; width: 35px; height: 35px; background: linear-gradient(135deg, #d7c8b7, #8c807b); border: 2px solid #ffffff40; border-radius: 50%; color: #292321; font-size: 11px; font-weight: 700; }
      .profile-button { background: none; border: 0; padding: 0; display: flex; align-items: center; gap: 8px; }
      .profile-button > .icon { width: 13px; color: var(--muted); }
      .mobile-toggle { display: none; }
      .content { padding: 0 30px 30px; max-width: 1800px; margin: auto; }
      .dashboard-grid { display: grid; grid-template-columns: minmax(0, 1fr) 294px; gap: 22px; }
      .dashboard-main { min-width: 0; display: grid; gap: 20px; align-content: start; }
      .hero { min-height: 191px; position: relative; display: flex; align-items: center; overflow: hidden; margin: -2px -4px 0; padding: 12px 8px 12px; isolation: isolate; }
      .hero-copy { z-index: 2; position: relative; }
      .hero .eyebrow { margin-bottom: 13px; font-size: 9px; letter-spacing: .34em; }
      .hero h1 { margin-bottom: 12px; font-weight: 550; }
      .hero h1 span { color: #ffbf54; display: inline-block; vertical-align: -2px; margin-left: 4px; }
      .hero p { font-size: 12px; color: #a9a29f; margin-bottom: 22px; }
      .hero-art { position: absolute; right: -28px; top: -40px; width: 54%; height: 262px; z-index: -1; }
      .month-picker { display: inline-flex; gap: 8px; align-items: center; background: #1b1a1f; border: 1px solid #ffffff08; border-radius: 10px; padding: 7px 11px; color: #d3cdc7; }
      .month-picker .icon { width: 14px; height: 14px; }
      .month-picker input { border: none; background: none; color: #ddd5ce; width: 132px; padding: 0; font-size: 10px; outline: none; }
      .hero-meta { display: flex; align-items: center; gap: 10px; }
      .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
      .kpi { display: flex; align-items: center; gap: 16px; width: 100%; padding: 19px 17px; text-align: left; border: 1px solid #ffffff09; border-radius: 17px; background: linear-gradient(115deg, #262021a8, #19171bbd); position: relative; transition: transform .2s, border-color .2s, box-shadow .2s; }
      .kpi:hover { transform: translateY(-3px); border-color: #ff9a3240; box-shadow: 0 5px 24px #0005; }
      .kpi-icon { width: 47px; height: 47px; display: flex; align-items: center; justify-content: center; background: linear-gradient(140deg, #ffb85e16, #ff9a3205); box-shadow: inset 0 1px 0 #ffffff06; border-radius: 16px; color: var(--gold); }
      .kpi-icon .icon { width: 27px; height: 27px; filter: drop-shadow(0 0 8px #ff9a3260); }
      .kpi-value { display: flex; align-items: center; gap: 10px; font-size: 25px; font-weight: 600; letter-spacing: -.03em; line-height: 1; }
      .kpi-trend { color: #86ba9c; font-size: 9px; font-weight: 400; letter-spacing: 0; }
      .kpi-label { display: block; font-size: 11px; color: #beb4af; margin-top: 8px; white-space: nowrap; }
      .kpi > .icon { width: 13px; color: #8d827b; margin-left: auto; }
      .center-panels { display: grid; grid-template-columns: 1.18fr 1fr; gap: 18px; }
      .campaign-panel { padding: 20px 19px 9px; }
      .campaign-panel .panel-header { margin-bottom: 12px; }
      .campaign-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid #ffffff06; min-width: 0; }
      .campaign-row:first-child { border-top-color: #ffffff04; }
      .campaign-hit { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; padding: 0; border: 0; background: none; text-align: left; }
      .campaign-hit:hover .campaign-name { color: var(--gold); }
      .thumb { display: flex; align-items: center; justify-content: center; width: 61px; height: 45px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: #201731; border: 1px solid #ffffff0c; }
      .thumb svg { width: 100%; height: 100%; }
      .campaign-copy { min-width: 0; }
      .campaign-name { display: block; font-size: 11px; font-weight: 500; line-height: 1.4; transition: color .2s; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .campaign-platforms { display: block; margin-top: 5px; color: #918a87; font-size: 9px; line-height: 1.4; }
      .campaign-row > .icon-button { width: 20px; height: 30px; }
      .campaign-row > .icon-button .icon { width: 13px; }
      .brief-panel { padding: 20px 19px; border-color: #ffc36b35; background: radial-gradient(ellipse at top left, #db823815, transparent 55%), linear-gradient(125deg, #201b1ee6, #151418); box-shadow: inset 1px 1px 0 #ffc36b20, 0 -3px 14px -10px #ff9a32; }
      .brief-panel::before { content: ""; position: absolute; top: 0; left: 16px; right: 12px; height: 1px; background: linear-gradient(90deg, #ffbe69, #e1843640, transparent); }
      .brief-panel .panel-header { margin-bottom: 18px; }
      textarea, input.field, select.field { width: 100%; background: #ffffff04; color: var(--text); border: 1px solid #ffffff17; border-radius: 10px; padding: 12px; font-size: 12px; transition: border-color .2s, box-shadow .2s; }
      textarea { resize: vertical; min-height: 95px; line-height: 1.6; }
      textarea::placeholder, input::placeholder { color: #89817c; }
      textarea:focus, .field:focus { border-color: #ff9a3270; outline: none; box-shadow: 0 0 0 3px #ff9a3207; }
      select { cursor: pointer; }
      select option { color: var(--text); background: #211e22; }
      .brief-selectors { display: flex; gap: 7px; margin-top: 8px; }
      .brief-selectors select { border: 1px solid #ffffff06; background: #ffffff05; border-radius: 8px; min-width: 0; max-width: 58%; padding: 7px 23px 7px 9px; color: #cac2ba; font-size: 10px; }
      .brief-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 10px; }
      .brief-footer .btn { padding: 10px 13px; min-height: 35px; font-size: 11px; }
      .brief-footer .icon { width: 14px; height: 14px; }
      .demo-note { color: #a28367; font-size: 8px; letter-spacing: .1em; }
      .rail { display: grid; align-content: start; gap: 20px; padding-top: 10px; }
      .quick-panel { padding: 20px 17px 17px; }
      .quick-panel .panel-header { margin-bottom: 17px; }
      .quick-actions { display: grid; gap: 8px; }
      .quick-action { display: flex; align-items: center; gap: 13px; width: 100%; border: 1px solid #ffffff04; border-radius: 10px; padding: 12px 13px; background: linear-gradient(110deg, #ffffff05, #ffffff03); text-align: left; font-size: 12px; transition: border-color .2s, background .2s, transform .2s; }
      .quick-action:hover { border-color: #ff9a3240; background: #ff9a3209; transform: translateX(2px); }
      .quick-action > .icon:first-child { width: 23px; height: 23px; color: #edbd79; filter: drop-shadow(0 0 7px #ff9a3222); }
      .quick-action > .icon:last-child { width: 13px; margin-left: auto; color: #968c87; }
      .upcoming-panel { padding: 20px 18px 10px; }
      .upcoming-panel .panel-header { margin-bottom: 7px; }
      .event-row { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid #ffffff08; }
      .event-hit { border: 0; width: 100%; padding: 0; background: none; text-align: left; display: flex; align-items: center; gap: 12px; }
      .date-tile { width: 45px; min-height: 52px; flex-shrink: 0; border-radius: 8px; border: 1px solid #ffffff05; background: linear-gradient(130deg, #ff9a3214, #ffffff04); display: grid; place-content: center; text-align: center; gap: 2px; }
      .date-tile span { font-size: 9px; color: #c1b6ae; text-transform: uppercase; }
      .date-tile strong { font-size: 20px; font-weight: 500; }
      .event-copy { flex: 1; min-width: 0; }
      .event-copy strong { display: block; font-size: 10px; font-weight: 500; line-height: 1.5; }
      .event-copy small { display: block; margin-top: 5px; font-size: 9px; color: #9a918c; }
      .event-hit > .icon { width: 13px; color: #8c827a; }
      .rail-footnote { text-align: center; color: #6f645d; font-size: 9px; letter-spacing: .04em; }
      .promo { min-height: 156px; width: 100%; padding: 27px 30px; text-align: left; cursor: pointer; background: #19161b; border-color: #ffffff24; isolation: isolate; display: flex; align-items: center; transition: border-color .3s; }
      .promo:hover { border-color: #ff9a3270; }
      .promo-copy { position: relative; z-index: 2; }
      .promo h2 { font-size: clamp(18px, 1.9vw, 26px); font-weight: 400; line-height: 1.45; letter-spacing: -.035em; }
      .promo h2 strong { color: #ffb35a; font-weight: 550; }
      .promo-line { width: 48px; height: 3px; background: linear-gradient(90deg, var(--gold), #ff9a3230); margin-top: 18px; }
      .studio-art { position: absolute; right: 0; top: 0; height: 100%; width: 63%; z-index: -1; }
      .promo-arrow { position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; display: grid; place-items: center; background: #ffffff0a; border: 1px solid #ffffff0d; border-radius: 10px; backdrop-filter: blur(8px); }
      .page-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; margin: 20px 0 27px; }
      .page-heading .eyebrow { margin-bottom: 12px; }
      .page-heading h1 { font-size: 31px; margin-bottom: 10px; }
      .page-heading p { font-size: 12px; color: var(--muted); line-height: 1.6; }
      .page-heading > .btn { margin-top: 18px; }
      .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
      .toolbar .search { flex: 1; max-width: 450px; }
      .toolbar select { width: auto; min-width: 140px; font-size: 11px; padding: 11px; }
      .toolbar-label { margin-left: auto; color: #91867c; font-size: 10px; }
      .full-campaign { padding: 5px 22px; }
      .full-campaign .campaign-row { gap: 17px; padding: 19px 0; }
      .full-campaign .thumb { width: 89px; height: 63px; }
      .full-campaign .campaign-name { font-size: 14px; }
      .full-campaign .campaign-platforms { font-size: 11px; }
      .row-actions { display: flex; gap: 4px; }
      .row-actions .icon { width: 16px; height: 16px; }
      .client-grid, .account-grid, .creative-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
      .client-card, .account-card { padding: 23px; }
      .initials { display: grid; place-items: center; width: 45px; height: 45px; flex-shrink: 0; border-radius: 13px; background: linear-gradient(135deg, #ffbe6926, #ff9a3208); border: 1px solid #ff9a3220; font-size: 17px; font-weight: 600; color: #f3c285; }
      .client-card h3, .account-card h3 { margin-top: 20px; margin-bottom: 6px; }
      .client-card .contact { display: grid; gap: 7px; padding: 20px 0; margin: 17px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
      .client-card .contact strong { color: #ded3c8; font-weight: 500; }
      .card-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .account-card p { color: var(--muted); font-size: 11px; line-height: 1.6; min-height: 35px; margin: 18px 0 20px; }
      .notice { display: flex; align-items: center; gap: 10px; padding: 13px 16px; border: 1px solid #ff9a321a; border-radius: 10px; background: #ff9a3205; color: #b6a28d; font-size: 11px; line-height: 1.6; margin-bottom: 24px; }
      .notice .icon { width: 16px; color: var(--gold); }
      .creative-card { overflow: hidden; }
      .creative-preview { display: flex; justify-content: center; align-items: center; width: 100%; height: 163px; border: 0; border-bottom: 1px solid var(--line); background: #151317; padding: 0; position: relative; }
      .creative-preview svg { height: 100%; width: 100%; }
      .creative-preview img, .creative-preview video { width: 100%; height: 100%; object-fit: contain; }
      .creative-content { padding: 17px; }
      .creative-content h3 { margin: 9px 0 7px; font-size: 13px; }
      .creative-content p { font-size: 10px; color: var(--muted); margin-bottom: 14px; }
      .category-tabs { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 20px; }
      .tab { border: 1px solid #ffffff0b; background: #ffffff03; border-radius: 8px; padding: 10px 14px; font-size: 11px; color: var(--muted); transition: background .2s, color .2s; }
      .tab.active { background: #ff9a3210; color: var(--gold); border-color: #ff9a3230; }
      .approval-card { display: flex; align-items: flex-start; gap: 20px; padding: 23px; }
      .approval-card > .thumb { width: 115px; height: 90px; }
      .approval-body { flex: 1; min-width: 0; }

      function renderAnalytics() {
        const month = state.preferences.month;
        const monthly = selectedCampaigns();
        const counts = STATUSES.map(status => state.campaigns.filter(c => c.status === status).length);
        const maxStatus = Math.max(...counts, 1);
        const monthStart = new Date(month + '-01T12:00:00');
        const months = Array.from({ length: 6 }, (_, i) => {
          const date = new Date(monthStart);
          date.setMonth(date.getMonth() - 5 + i);
          return { key: `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}`, label: date.toLocaleDateString('en-US', { month: 'short' }) };
        });
        const monthlyCounts = months.map(m => state.campaigns.filter(c => c.startDate.startsWith(m.key)).length);
        const maxMonthly = Math.max(...monthlyCounts, 1);
        const platforms = PLATFORMS.map(platform => ({ platform, count: state.campaigns.filter(c => c.platforms.includes(platform)).length }));
        const assignments = platforms.reduce((sum, p) => sum + p.count, 0);
        main.innerHTML = `<div class="page-view">${heading('THE BIG PICTURE', 'Clarity for your next move.', 'Workspace activity, not advertising results. Every number comes from your local records.')}<div class="notice">${icon('chart')}SAMPLE ANALYTICS — campaign counts and planning activity only. No live impressions, spend, clicks or performance claims.</div><div class="analytics-kpis">${[['Total campaigns', state.campaigns.length], ['Running campaigns', state.campaigns.filter(c => c.status === 'Running').length], ['Completed campaigns', state.campaigns.filter(c => c.status === 'Completed').length], ['Pending approvals', state.approvals.filter(a => a.status === 'Pending').length]].map(([label, n]) => `<div class="panel stat-card"><span>${label}</span><strong>${n}</strong></div>`).join('')}</div><div class="chart-grid"><section class="panel chart-box"><h2>Campaign performance overview</h2><p>Planning status distribution · counts, not ad results</p><div class="bar-chart" role="img" aria-label="${STATUSES.map((s, i) => s + ': ' + counts[i]).join(', ')}">${counts.map(n => `<div class="bar-column"><strong>${n}</strong><div class="bar" style="height:${Math.max(n / maxStatus * 145, 2)}px"></div></div>`).join('')}</div><div class="bar-labels">${STATUSES.map(s => `<span>${s}</span>`).join('')}</div></section><section class="panel chart-box"><h2>Platform distribution</h2><p>${assignments} platform assignments across ${state.campaigns.length} campaigns</p><div class="distribution">${platforms.map(p => `<div class="distribution-row"><div class="row between"><span>${p.platform}</span><span class="gold">${p.count} · ${assignments ? Math.round(p.count / assignments * 100) : 0}%</span></div><div class="progress"><span style="width:${assignments ? p.count / assignments * 100 : 0}%"></span></div></div>`).join('')}</div></section><section class="panel chart-box"><div class="row between wrap"><div><h2>Monthly campaign activity</h2><p class="small muted" style="margin-top:8px">New campaigns by start date</p></div><label class="month-picker">${icon('calendar')}<input type="month" id="analytics-month" value="${month}" aria-label="Analytics end month" /></label></div><div class="bar-chart" role="img" aria-label="${months.map((m, i) => m.label + ': ' + monthlyCounts[i]).join(', ')}">${monthlyCounts.map(n => `<div class="bar-column"><strong>${n}</strong><div class="bar" style="height:${Math.max(n / maxMonthly * 145, 2)}px"></div></div>`).join('')}</div><div class="bar-labels">${months.map(m => `<span>${m.label}</span>`).join('')}</div></section><section class="panel chart-box"><h2>${monthLabel(month)} at a glance</h2><div class="details-grid"><div><dt>Scheduled campaigns</dt><dd style="font-size:28px;color:var(--gold)">${monthly.length}</dd></div><div><dt>Calendar milestones</dt><dd style="font-size:28px;color:var(--gold)">${state.events.filter(e => e.date.startsWith(month)).length}</dd></div><div><dt>Creative concepts</dt><dd>${state.creatives.length} local records</dd></div><div><dt>Client relationships</dt><dd>${state.clients.length} clients</dd></div></div>${button('Explore campaigns', 'navigate', 'campaigns', 'text-button', 'arrow')}</section></div></div>`;

      function renderSchedule() {
        const month = state.preferences.month;
        const first = new Date(month + '-01T12:00:00');
        const start = new Date(first);
        start.setDate(start.getDate() - (first.getDay() + 6) % 7);
        const cells = Array.from({ length: 42 }, (_, i) => {

      // Meaningful, unique test hooks also cover generated modal fields and sample information.
      function instrument(root, scope) {
        const slug = value => String(value).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 65);
        const used = new Set(Array.from(document.querySelectorAll('[data-testid]')).map(el => el.dataset.testid));
        root.querySelectorAll('button, input, select, textarea, h1, h2, h3, p, label, strong, small, dt, dd, kbd, .badge, .demo-badge, .eyebrow, .muted, .campaign-name, .campaign-platforms, .event-copy, .date-tile, .kpi-label, .kpi-value, .demo-note, .notice, .initials, .avatar, .rail-footnote, .notification-item span, .search-result span').forEach(el => {
          if (el.dataset.testid) return;
          const name = el.dataset.action ? `${el.dataset.action}-${el.dataset.id || ''}` : el.id || el.name || el.getAttribute('aria-label') || el.textContent.trim().slice(0, 55) || el.tagName;
          let id = slug(`${scope}-${name}`) || scope + '-element';
          let n = 2;
          const base = id;
          while (used.has(id)) id = base + '-' + n++;
          el.dataset.testid = id;
          used.add(id);
        });
      }

      function animateCounters() {
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches || state.preferences.reducedMotion) return;
        const start = performance.now();
        const counters = Array.from(document.querySelectorAll('[data-counter]'));
        function step(now) {
          const progress = Math.min((now - start) / 650, 1);
          counters.forEach(el => { if (el.isConnected) el.textContent = Math.round(Number(el.dataset.counter) * (1 - Math.pow(1 - progress, 3))); });
          if (progress < 1) requestAnimationFrame(step);
        }
        requestAnimationFrame(step);
      }

      function generateSample(input) {
        const idea = input.idea.trim();
        const ideaTitle = idea.length > 75 ? idea.slice(0, 72) + '…' : idea;
        const audience = input.platform === 'LinkedIn' ? 'Professionals, team leads and decision-makers exploring better ways to work.' : input.platform === 'YouTube' ? 'Curious viewers searching for useful stories, fresh perspectives and in-depth demonstrations.' : input.platform === 'Facebook' ? 'Community-minded adults interested in practical benefits and relatable brand stories.' : input.platform === 'X' ? 'Conversation-driven early adopters who follow trends and share new ideas.' : 'Visually engaged young adults who discover brands through creators, Reels and community recommendations.';
        const goals = {
          'Brand Awareness': ['Introduce the brand with a memorable, consistent story and build recognition.', 'Discover the story'],
          'Product Launch': ['Introduce the new offering, explain its key benefit and encourage people to explore.', 'Meet your next favorite'],
          'Lead Generation': ['Show a useful solution and invite interested people to take the next step.', 'Get the free guide'],
          'Event Promotion': ['Build anticipation, explain what makes the event worthwhile and invite registrations.', 'Reserve your spot'],
          'Engagement': ['Start meaningful conversations and invite the audience to participate.', 'Tell us your take'],
          'Sales Conversion': ['Make the product benefit tangible and give interested people a clear route to purchase.', 'Explore the collection']
        };
        const [objective, cta] = goals[input.type] || goals['Brand Awareness'];
        const format = input.platform === 'YouTube' ? 'A 45–60 second hero video, a 15-second cutdown and a behind-the-scenes short.' : input.platform === 'LinkedIn' ? 'A concise thought-leadership post, a five-slide insight carousel and a short founder story.' : input.platform === 'X' ? 'A strong opening post, a three-part story thread and a community question.' : 'A 15–30 second vertical hero video, a five-frame carousel and an interactive story.';
        const direction = `${input.tone || 'Bold & confident'} storytelling. Open with a recognizable problem, show one clear benefit, then resolve with a single action. Use warm light, considered typography and authentic close-ups. Avoid unverified claims.`;
        const schedule = 'Day 1: teaser + audience question. Day 3: hero story. Day 5: benefit-led carousel. Day 7: recap + CTA. Test publishing times against your own audience; no live scheduling is performed.';
        const brief = `SAMPLE CREATIVE BRIEF · LOCAL DEMO\n\nCAMPAIGN IDEA\n${idea}\n\nCAMPAIGN OBJECTIVE\n${objective}\n\nTARGET AUDIENCE\n${audience}\nValidate this starting assumption with client research.\n\nSUGGESTED CONTENT\n${format}\nConnect each concept to: ${ideaTitle}\n\nCREATIVE DIRECTION\n${direction}\n\nSUGGESTED CTA\n“${cta}”\n\nSUGGESTED PUBLISHING SCHEDULE\n${schedule}\n\nPlatform: ${input.platform} · Type: ${input.type}\nSample suggestions, not live AI or performance guarantees.`;
        let text = brief;
        if (input.kind === 'Campaign Ideas') text = `SAMPLE CAMPAIGN IDEAS · LOCAL DEMO\n\nYOUR STARTING POINT\n${idea}\n\n01 / THE BEFORE & AFTER\nShow the everyday tension behind this idea, then reveal a simpler possibility. Build the story around one relatable person.\n\n02 / MADE FOR YOUR MOMENT\nInvite your community to show how this idea fits into a real day. Use a recognizable visual thread across creator-led posts.\n\n03 / BEHIND THE BIG IDEA\nTake the audience inside the process. Pair a candid behind-the-scenes moment with a useful insight about ${ideaTitle}.\n\nFORMAT\n${format}\n\nOBJECTIVE\n${objective}\n\nCTA\n${cta}\n\n${input.platform} · ${input.type} · ${input.tone}\nLocal template suggestions. Adapt to your brand and validate every claim.`;
        if (input.kind === 'Ad Copy') text = `SAMPLE AD COPY · LOCAL DEMO\n\nCAMPAIGN\n${idea}\n\nHEADLINE OPTIONS\n1. Your next chapter starts with one good idea.\n2. Made for the way you move forward.\n3. Something worth a second look.\n\nPRIMARY COPY\nBig changes start with everyday moments. ${ideaTitle}. See what a fresh perspective could look like for you. No big promises. Just a new possibility worth exploring.\n\nSHORT CUTDOWN\nA fresh idea. A real possibility. ${cta}.\n\nCTA\n${cta}\n\nCREATIVE NOTE\n${direction}\n\n${input.platform} · ${input.tone}\nSample copy only. Confirm product details and claims before use.`;
        if (input.kind === 'Social Captions') text = `SAMPLE SOCIAL CAPTIONS · LOCAL DEMO\n\nIDEA\n${idea}\n\n01 / THE INTRODUCTION\nA little curiosity can lead somewhere good. We’re making room for ${ideaTitle}. Come see what’s next.\n\n02 / THE CONVERSATION\nWhat’s one thing you’d change about the everyday? We’re starting with this: ${ideaTitle}. Tell us your take below.\n\n03 / THE INVITATION\nGood things are better shared. Take a closer look, bring a friend and make the next moment yours. ${cta}.\n\nHASHTAG STARTERS\n#NewPerspective #MadeForYourMoment #BehindTheIdea\nCheck relevance before posting; no reach is guaranteed.\n\n${input.platform} · ${input.tone}\nSample captions, locally generated. Nothing has been published.`;
        if (input.kind === 'Video Concepts') text = `SAMPLE VIDEO CONCEPT · LOCAL DEMO\n\nWORKING TITLE\nA new point of view\n\nCAMPAIGN\n${idea}\n\n00:00–00:03 / HOOK\nClose-up of an everyday moment. On-screen text: “What if there’s another way?”\n\n00:03–00:10 / TENSION\nThree quick scenes establish the problem behind: ${ideaTitle}. Natural sound, deliberate cuts.\n\n00:10–00:22 / REVEAL\nIntroduce the idea through one genuine benefit. Show it in context, not as a list of unverified claims.\n\n00:22–00:30 / RESOLUTION\nReturn to the opening moment, now seen differently. End card: “${cta}”.\n\nDIRECTION\n${direction}\n\nDELIVERABLES\n${format}\n\n${input.platform} · ${input.type} · ${input.tone}\nSample storyboard only. No video has been generated.`;
        return { text, brief, idea, title: ideaTitle, platform: input.platform, type: input.type };
      }

      async function generateBrief(form) {
        if (!validateForm(form)) return;
        const data = Object.fromEntries(new FormData(form));
        const btn = form.querySelector('[type="submit"]');
        const original = btn.innerHTML;
        btn.disabled = true;
        btn.innerHTML = '<span class="loader"></span>Creating sample...';
        try {
          ui.brief = await CreatorOSAdapters.gateway.generate({ ...data, kind: 'Creative Briefs' });
          showBrief();
        } finally {
          if (btn.isConnected) { btn.disabled = false; btn.innerHTML = original; }
        }
      }
      function showBrief() {
        if (!ui.brief) return;
        openModal('Your next big idea, outlined.', `<div class="notice">${icon('sparkles')}DEMO MODE — structured local sample, not live AI.</div><textarea class="brief-output" id="brief-result" readonly aria-label="Generated sample creative brief" maxlength="15000">${esc(ui.brief.brief)}</textarea><div class="modal-footer wrap">${button('Copy brief', 'copy-brief', '', 'btn', 'copy')}${button('Edit brief', 'edit-brief', '', 'btn', 'edit')}${button('Save campaign', 'brief-to-campaign', '', 'btn primary', 'save')}</div>`, true, { kind: 'brief' });
      }
      async function copyText(text) {
        if (!text.trim()) return toast('There is nothing to copy yet.', 'info');
        try {
          if (!navigator.clipboard?.writeText) throw new Error('Clipboard unavailable');
          await navigator.clipboard.writeText(text);
          toast('Copied to clipboard. Make it yours.');
        } catch (error) {
          const area = document.createElement('textarea');
          area.value = text;
          area.style.position = 'fixed';
          area.style.opacity = '0';
          document.body.append(area);
          area.select();
          const copied = document.execCommand('copy');
          area.remove();
          if (copied) toast('Copied to clipboard.');
          else openModal('Copy your text', `<p class="modal-description">Your browser blocked automatic clipboard access. Select the text below and press Ctrl+C or use your device’s Copy menu.</p><textarea id="manual-copy" aria-label="Text to copy" style="min-height:280px">${esc(text)}</textarea><div class="modal-footer">${button('Done', 'close-modal', '', 'btn primary')}</div>`, true);
        }
      }
      function validateForm(form) {
        form.querySelectorAll('input[type="text"], input[type="email"], textarea').forEach(input => {
          input.setCustomValidity(input.required && !input.value.trim() ? 'Please enter more than spaces.' : '');
        });
        return form.reportValidity();
      }

      async function submitForm(event) {
        const form = event.target;
        if (!(form instanceof HTMLFormElement)) return;
        event.preventDefault();
        if (form.id === 'brief-form') return generateBrief(form);
        if (!validateForm(form)) return;
        const fd = new FormData(form);
        const data = Object.fromEntries(Array.from(fd).map(([key, value]) => [key, typeof value === 'string' ? value.trim() : value]));
        const modal = ui.modal || {};
        if (form.id === 'campaign-form') {
          const platforms = fd.getAll('platforms');
          if (!platforms.length) return formError('Choose at least one platform.');
          if (data.endDate < data.startDate) return formError('End date must be on or after the start date.');
          const c = { id: modal.id || uid(), title: data.title, clientId: data.clientId, type: data.type, platforms, status: data.status, startDate: data.startDate, endDate: data.endDate, description: data.description, art: modal.art };
          const index = state.campaigns.findIndex(item => item.id === modal.id);
          if (index >= 0) state.campaigns[index] = c;
          else state.campaigns.push(c);
          notify(`${modal.id ? 'Updated' : 'Created'}: ${c.title}`, 'campaigns');
          closeModal();
          commit(modal.id ? 'Campaign updated.' : 'Your new campaign has a home.');
        } else if (form.id === 'client-form') {
          if (state.clients.some(c => c.id !== modal.id && c.name.toLowerCase() === data.name.toLowerCase())) return formError('A client with this name already exists.');
          const c = { id: modal.id || uid(), name: data.name, industry: data.industry, contact: data.contact, email: data.email, status: data.status };
          const index = state.clients.findIndex(item => item.id === modal.id);
          if (index >= 0) state.clients[index] = c;
          else state.clients.push(c);
          closeModal();
          commit(modal.id ? 'Client details updated.' : 'Here’s to a great collaboration. Client added.');
        } else if (form.id === 'creative-form') {
          const file = fd.get('file');
          const hasFile = file instanceof File && file.size > 0;
          if (!modal.id && !hasFile) return formError('Choose a non-empty local file.');
          if (hasFile && file.size > 100 * 1024 * 1024) return formError('Please choose a file smaller than 100 MB.');
          const old = state.creatives.find(c => c.id === modal.id);
          const id = modal.id || uid();
          const c = { ...(old || {}), id, title: data.title, category: data.category, campaignId: data.campaignId, notes: data.notes, art: old?.art || 'tech', fileName: hasFile ? file.name : old.fileName, fileType: hasFile ? file.type : old.fileType, fileSize: hasFile ? file.size : old.fileSize, sample: hasFile ? false : old.sample, createdAt: old?.createdAt || localToday() };
          if (hasFile) {
            if (previews.has(id)) URL.revokeObjectURL(previews.get(id));
            previews.set(id, URL.createObjectURL(file));
          }
          const index = state.creatives.findIndex(item => item.id === id);
          if (index >= 0) state.creatives[index] = c;
          else state.creatives.push(c);
          if (modal.fileUrl) URL.revokeObjectURL(modal.fileUrl);
          closeModal();
          commit('Metadata saved locally. File preview is session-only.');
        } else if (form.id === 'approval-form') {
          if (!campaignById(data.campaignId)) return formError('Please choose an existing campaign.');
          if (data.creativeId && !state.creatives.some(c => c.id === data.creativeId && c.campaignId === data.campaignId)) return formError('Choose a creative belonging to this campaign.');
          state.approvals.push({ id: uid(), campaignId: data.campaignId, creativeId: data.creativeId, requestedBy: data.requestedBy, reviewer: data.reviewer, submittedDate: localToday(), status: 'Pending', comment: data.comment });
          notify('A new creative is ready for review', 'approvals');
          closeModal();
          commit('Approval request saved locally. No message was sent.');
        } else if (form.id === 'review-form') {
          const a = state.approvals.find(a => a.id === modal.id);
          if (!a) return;
          a.comment = data.comment;
          a.reviewer = data.reviewer;
          if (modal.status !== 'comment') a.status = modal.status;
          notify(`Review updated: ${campaignTitle(a.campaignId)}`, 'approvals');
          closeModal();
          commit('Your review has been saved.');
        } else if (form.id === 'event-form') {
          if (data.end <= data.start) return formError('End time must be later than start time on the same day.');
          const e = { id: modal.id || uid(), title: data.title, date: data.date, start: data.start, end: data.end, campaignId: data.campaignId, notes: data.notes };
          const index = state.events.findIndex(item => item.id === modal.id);
          if (index >= 0) state.events[index] = e;
          else state.events.push(e);
          state.preferences.month = e.date.slice(0, 7);
          ui.selectedDate = '';
          closeModal();
          commit('A moment worth making time for. Event saved.');
        } else if (form.id === 'profile-form') {
          state.profile = { name: data.name, role: data.role, email: data.email };
          closeModal();
          commit('Local profile updated.');
        } else if (form.id === 'preferences-form') {
          state.preferences.defaultPlatform = data.defaultPlatform;
          state.preferences.reducedMotion = data.reducedMotion === 'reduced';
          state.preferences.notifications = data.notifications === 'on';
          ui.studioDraft.platform = data.defaultPlatform;
          if (ui.modal) closeModal();
          commit('Your workspace, just the way you like it.');
        } else if (form.id === 'studio-form') {
          if (ui.studioBusy) return;
          ui.studioDraft = { idea: data.idea, platform: data.platform, type: data.type, tone: data.tone };
          ui.studioBusy = true;
          const requestedTab = ui.studioTab;
          render();
          const result = await CreatorOSAdapters.gateway.generate({ ...data, kind: requestedTab });
          ui.studioOutput = result.text;
          ui.studioTitle = result.title;
          ui.studioBusy = false;
          if (ui.view === 'studio') render();
          toast('Your local sample is ready. Make it your own.');
        }
      }
      function localToday() {
        const d = new Date();
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      async function handleAction(action, id, target, event) {
        switch (action) {
          case 'navigate': navigate(id); break;
          case 'drawer': document.body.classList.add('drawer-open'); break;
          case 'close-drawer': document.body.classList.remove('drawer-open'); break;
          case 'collapse': state.preferences.compact = !state.preferences.compact; persist(); render(); break;
          case 'persona-menu': ui.popup = ui.popup === 'persona' ? '' : 'persona'; renderHeader(); instrument(document.body, 'header'); break;
          case 'workspace': openModal('Your agency workspace', `<div class="detail-hero"><span class="initials">${icon('agency')}</span><div><h3>Agency</h3><p class="small muted" style="margin-top:8px">CreatorOS AI · Standalone local demo</p></div></div><p class="modal-description" style="margin-top:22px">One shared creative perspective, kept entirely in this browser. This demo includes one agency workspace. No account or subscription is required.</p><div class="modal-footer">${button('Workspace preferences', 'preferences', '', 'btn primary', 'settings')}</div>`); break;
          case 'notifications': ui.popup = ui.popup === 'notifications' ? '' : 'notifications'; renderHeader(); instrument(document.body, 'header'); break;
          case 'profile-menu': ui.popup = ui.popup === 'profile' ? '' : 'profile'; renderHeader(); instrument(document.body, 'header'); break;
          case 'read-notifications': state.notifications.forEach(n => n.read = true); persist(); renderHeader(); instrument(document.body, 'header'); break;
          case 'open-notification': {
            const n = state.notifications.find(n => n.id === id);
            if (n) { n.read = true; persist(); navigate(n.view); }
            break;
          }
          case 'close-modal': if (ui.modal?.fileUrl) URL.revokeObjectURL(ui.modal.fileUrl); closeModal(); break;
          case 'backdrop': if (event.target === target) { if (ui.modal?.fileUrl) URL.revokeObjectURL(ui.modal.fileUrl); closeModal(); } break;
          case 'new-campaign': campaignForm(); break;
          case 'edit-campaign': campaignForm(id); break;
          case 'campaign-detail': campaignDetail(id); break;
          case 'delete-campaign': confirmDelete('campaign', id); break;
          case 'toggle-campaign':
          case 'toggle-campaign-modal': {
            const c = campaignById(id);
            if (!c) break;
            c.status = c.status === 'Running' ? 'Paused' : 'Running';
            persist();
            render();
            if (action.endsWith('modal')) campaignDetail(id);
            toast(`Demo campaign ${c.status.toLowerCase()}. No live ads affected.`);
            break;
          }
          case 'new-client': clientForm(); break;
          case 'edit-client': clientForm(id); break;
          case 'client-detail': clientDetail(id); break;
          case 'delete-client': confirmDelete('client', id); break;
          case 'new-creative': creativeForm(); break;
          case 'edit-creative': creativeForm(id); break;
          case 'creative-detail': creativeDetail(id); break;
          case 'delete-creative': confirmDelete('creative', id); break;
          case 'creative-category': ui.category = id; ui.filter = 'All'; render(); break;
          case 'new-approval': approvalForm(); break;
          case 'review-approve': reviewForm(id, 'Approved'); break;
          case 'review-reject': reviewForm(id, 'Rejected'); break;
          case 'review-changes': reviewForm(id, 'Changes Requested'); break;
          case 'review-comment': reviewForm(id, 'comment'); break;
          case 'new-event': eventForm(); break;
          case 'edit-event': eventForm(id); break;
          case 'event-detail': eventDetail(id); break;
          case 'delete-event': confirmDelete('event', id); break;
          case 'select-date': ui.selectedDate = id; if (!id.startsWith(state.preferences.month)) state.preferences.month = id.slice(0, 7); persist(); render(); break;
          case 'clear-date': ui.selectedDate = ''; render(); break;
          case 'month-previous':
          case 'month-next': {
            const d = new Date(state.preferences.month + '-01T12:00:00');
            d.setMonth(d.getMonth() + (action === 'month-next' ? 1 : -1));
            state.preferences.month = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
            ui.selectedDate = '';
            persist(); render(); break;
          }
          case 'toggle-account':
          case 'toggle-account-modal': {
            const index = state.accounts.findIndex(a => a.id === id);
            if (index < 0) break;
            const a = state.accounts[index];
            state.accounts[index] = await CreatorOSAdapters.accounts[a.connected ? 'disconnect' : 'connect'](a);
            persist(); render();
            if (action.endsWith('modal')) accountDetail(id);
            toast(a.connected ? 'Demo disconnected. No real account was affected.' : 'Demo connected. No real account access was granted.');
            break;
          }
          case 'account-detail': accountDetail(id); break;
          case 'copy-brief': copyText(document.getElementById('brief-result').value); break;
          case 'edit-brief': {
            const area = document.getElementById('brief-result');

            break;

            captureStudioDraft();
            ui.studioTab = id; ui.studioOutput = ''; render(); break;
          case 'copy-studio': copyText(document.getElementById('studio-result').value); break;
          case 'save-studio': {
            const area = document.getElementById('studio-result');
            if (!area || !area.value.trim()) return toast('Add some content before saving.', 'info');
            ui.studioOutput = area.value;
            state.savedOutputs.push({ id: uid(), title: ui.studioTitle || 'Untitled creative idea', kind: ui.studioTab, platform: ui.studioDraft.platform, type: ui.studioDraft.type, content: ui.studioOutput, date: localToday() });
            commit('A good idea, kept. Saved locally.');
            break;
          }
          case 'open-output': {
            const o = state.savedOutputs.find(o => o.id === id);
            if (!o) break;
            ui.studioTab = o.kind; ui.studioOutput = o.content; ui.studioTitle = o.title;
            ui.studioDraft.platform = o.platform; ui.studioDraft.type = o.type;
            render(); window.scrollTo({ top: 0, behavior: 'smooth' }); break;
          }
          case 'delete-output': confirmDelete('output', id); break;
          case 'confirm-delete': {
            const kind = ui.modal.resource;
            const maps = { campaign: 'campaigns', client: 'clients', creative: 'creatives', event: 'events', output: 'savedOutputs' };
            state[maps[kind]] = state[maps[kind]].filter(item => item.id !== id);
            if (kind === 'campaign') {
              state.approvals = state.approvals.filter(a => a.campaignId !== id);
              state.events = state.events.filter(e => e.campaignId !== id);
              state.creatives.forEach(c => { if (c.campaignId === id) c.campaignId = ''; });
            }
            if (kind === 'client') state.campaigns.forEach(c => { if (c.clientId === id) c.clientId = ''; });
            if (kind === 'creative') {
              state.approvals = state.approvals.filter(a => a.creativeId !== id);
              if (previews.has(id)) URL.revokeObjectURL(previews.get(id));
              previews.delete(id);
            }
            closeModal(); commit('Local ' + kind + ' deleted.'); break;

            renderHeader();

              break;
            }
            if (window.CreatorAuth) {
              window.CreatorAuth.switchPersona(id);
            } else {
              const routes = { content_creator: 'creator.html', product_builder: 'Product%20based.html', freelancer: 'Freelancer.html', advertiser: 'advertisor.html' };

              window.location.href = routes[id] || 'persona.html';

          }
          case 'retake-questionnaire': window.location.href = 'persona.html?switch=true&retake=true'; break;
          case 'logout': window.CreatorAuth ? window.CreatorAuth.signOut() : (localStorage.removeItem('creatoros_persona'), window.location.href = 'signin.html'); break;
          case 'edit-profile': openModal('The person behind the ideas.', `<p class="modal-description">Your local demo profile. This does not create an account or change a real login.</p><form id="profile-form">${field('Display name', 'name', state.profile.name, { max: 70 })}${field('Role', 'role', state.profile.role, { max: 70 })}${field('Email', 'email', state.profile.email, { type: 'email', max: 150 })}${footer('Save profile')}</form>`, false, { kind: 'profile' }); break;
          case 'preferences': openModal('A workspace that feels like you.', `<form id="preferences-form">${preferencesForm()}</form>`, false, { kind: 'preferences' }); break;
          case 'reset': openModal('A fresh canvas?', `<p class="modal-description">This resets all campaigns, clients, creative metadata, approvals, events, account simulations, notifications and preferences to the original sample data. Saved Studio outputs will be removed. Original files on your device are never affected.</p><div class="modal-footer">${button('Keep my work', 'close-modal')}${button('Reset demo data', 'confirm-reset', '', 'btn danger', 'reset')}</div>`, false, { kind: 'reset' }); break;
          case 'confirm-reset':

          case 'help': openModal('A little orientation.', `<div class="notice">${icon('cube')}CreatorOS AI · Standalone Agency Demo</div><div class="stack"><div><h3>Your command centre</h3><p class="modal-description" style="margin-top:8px;margin-bottom:0">Manage campaigns and clients, organize local creative files, collect review notes and plan your calendar. Use Ctrl+K (or ⌘K) to find anything.</p></div><div><h3>A creative starting point</h3><p class="modal-description" style="margin-top:8px;margin-bottom:0">The Creative Brief and Studio tools build editable sample text using local templates. They are not connected to live AI.</p></div><div><h3>Built to stay local</h3><p class="modal-description" style="margin-top:8px;margin-bottom:0">Records persist in this browser, not on a server. File previews last only for this session. Ad account connections are simulated; nothing is published or sent.</p></div><div><h3>Looking for a clean slate?</h3><p class="modal-description" style="margin-top:8px;margin-bottom:0">Reset the sample data from Settings or your profile menu. This cannot be undone.</p></div></div><div class="modal-footer">${button('Explore Creative Studio', 'help-studio', '', 'btn primary', 'sparkles')}</div>`, true); break;
          case 'help-studio': closeModal(); navigate('studio'); break;
        }
      }

      function captureStudioDraft() {
        const form = document.getElementById('studio-form');
        if (form) ui.studioDraft = Object.fromEntries(new FormData(form));
        const result = document.getElementById('studio-result');
        if (result) ui.studioOutput = result.value;
      }
      document.addEventListener('submit', submitForm);
      document.addEventListener('click', event => {
        const target = event.target.closest('[data-action]');
        if (target) {
          if (ui.view === 'studio' && target.dataset.action === 'navigate') captureStudioDraft();
          handleAction(target.dataset.action, target.dataset.id || '', target, event);
        } else {
          if (!event.target.closest('.search-wrap')) {
            const results = document.getElementById('global-results');
            if (results) results.innerHTML = '';

          if (ui.popup && !event.target.closest('.popover')) { ui.popup = ''; renderPopup(); }
        }
      });
      document.addEventListener('input', event => {
        const el = event.target;
        if (el.setCustomValidity) el.setCustomValidity('');
        if (el.id === 'global-search') globalSearch(el.value);
        if (el.id === 'section-search') {
          const position = el.selectionStart;
          ui.query = el.value;
          const viewRenderers = { campaigns: renderCampaigns, clients: renderClients, creatives: renderCreatives, approvals: renderApprovals };
          viewRenderers[ui.view]?.();
          instrument(main, ui.view);
          const replacement = document.getElementById('section-search');
          replacement?.focus();
          if (replacement && replacement.type !== 'search') replacement.setSelectionRange(position, position);
        }
        if (el.id === 'studio-result') ui.studioOutput = el.value;
        if (el.id === 'brief-result' && ui.brief) ui.brief.brief = el.value;
      });
      document.addEventListener('change', event => {
        const el = event.target;
        if (['overview-month', 'analytics-month'].includes(el.id) && /^\d{4}-\d{2}$/.test(el.value)) { state.preferences.month = el.value; persist(); render(); }
        if (el.id === 'section-filter') { ui.filter = el.value; render(); }
        if (el.id === 'section-sort') { ui.sort = el.value; render(); }
        if (el.id === 'form-campaignId' && el.closest('#approval-form')) {
          const creativeSelect = document.getElementById('form-creativeId');
          creativeSelect.innerHTML = '<option value="">Campaign concept (no file)</option>' + state.creatives.filter(c => c.campaignId === el.value).map(c => `<option value="${esc(c.id)}">${esc(c.title)}</option>`).join('');
        }
        if (el.id === 'creative-file') {
          const file = el.files[0];
          const preview = document.getElementById('file-preview');
          if (ui.modal.fileUrl) URL.revokeObjectURL(ui.modal.fileUrl);
          preview.innerHTML = '';
          if (!file) return;
          if (file.size > 100 * 1024 * 1024) { el.setCustomValidity('Choose a file smaller than 100 MB.'); el.reportValidity(); return; }
          const url = URL.createObjectURL(file);
          ui.modal.fileUrl = url;
          if (file.type.startsWith('image/')) preview.innerHTML = `<div class="preview-large"><img src="${esc(url)}" alt="Selected local file preview" /></div>`;
          else if (file.type.startsWith('video/')) preview.innerHTML = `<div class="preview-large"><video controls src="${esc(url)}" aria-label="Selected local video preview"></video></div>`;
          else preview.innerHTML = `<p class="small muted" style="margin-bottom:18px">${esc(file.name)} — metadata only. No inline preview for this file type.</p>`;
          instrument(preview, 'file-preview');
        }
      });
      document.addEventListener('keydown', event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === 'k') {
          event.preventDefault();
          if (!ui.modal) document.getElementById('global-search')?.focus();
        }
        if (event.key === 'Escape') {
          if (ui.modal) { if (ui.modal.fileUrl) URL.revokeObjectURL(ui.modal.fileUrl); closeModal(); }
          else { ui.popup = ''; renderPopup(); document.getElementById('global-results').innerHTML = ''; document.body.classList.remove('drawer-open'); }
        }
        if (event.key === 'Tab' && ui.modal) {
          const focusable = Array.from(document.querySelectorAll('.modal button, .modal input, .modal select, .modal textarea, .modal a')).filter(el => !el.disabled && el.offsetParent !== null);
          const first = focusable[0];
          const last = focusable[focusable.length - 1];
          if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last?.focus(); }
          if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first?.focus(); }
        }
      });
      window.addEventListener('beforeunload', () => previews.forEach(url => URL.revokeObjectURL(url)));
      render();
      persist();
    </script>
