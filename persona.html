      * { box-sizing: border-box; }

        min-width: 320px;

      }
      button, input, textarea { font: inherit; }

      button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .ambient {
        position: fixed;
        z-index: 0;
        top: -22rem;
        left: 50%;
        width: 52rem;
        height: 34rem;
        pointer-events: none;
        transform: translateX(-50%);
        background: radial-gradient(ellipse, rgba(169, 231, 111, .095) 0%, rgba(169, 231, 111, .025) 34%, transparent 70%);

      .shell { position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }

      .progress-value { width: 25%; height: 100%; border-radius: inherit; background: var(--accent); box-shadow: 0 0 13px rgba(169,231,111,.65); transition: width 500ms cubic-bezier(.22,1,.36,1); }

      .lede { max-width: 510px; margin: 22px 0 0; color: var(--muted); font-size: 16px; line-height: 1.65; }
      .privacy-list { display: grid; gap: 0; margin: 50px 0 0; border-top: 1px solid var(--line); }
      .privacy-row { display: grid; grid-template-columns: 155px 1fr; gap: 22px; padding: 21px 0; border-bottom: 1px solid var(--line); animation: rise-in 500ms both; }
      .privacy-row:nth-child(2) { animation-delay: 70ms; }

      .draft-tag, .preview-tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 8px; border: 1px solid rgba(169,231,111,.28); border-radius: 99px; color: var(--accent); background: rgba(169,231,111,.07); font-size: 10px; font-weight: 650; letter-spacing: .03em; }

      .button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; min-height: 46px; padding: 0 19px; border: 1px solid transparent; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 650; transition: transform 180ms ease, background 180ms ease, border-color 180ms ease, color 180ms ease, box-shadow 180ms ease; }
      .button:hover:not(:disabled) { transform: translateY(-2px); }
      .button:active:not(:disabled) { transform: translateY(0); }
      .button-primary { color: #071000; background: var(--accent); box-shadow: 0 8px 27px rgba(169,231,111,.1); }
      .button-primary:hover:not(:disabled) { background: var(--accent-strong); box-shadow: 0 10px 30px rgba(169,231,111,.2); }
      .button-secondary { color: var(--muted); border-color: var(--line); background: rgba(255,255,255,.025); }
      .button-secondary:hover:not(:disabled) { color: var(--text); border-color: var(--line-strong); background: rgba(255,255,255,.06); }
      .button-quiet { padding: 0 8px; color: var(--muted); background: transparent; }
      .button:disabled { cursor: not-allowed; opacity: .34; transform: none; }
      .button svg { width: 15px; height: 15px; }
      .centered { width: 100%; max-width: 620px; margin: 0 auto; }
      .persona-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 42px; }
      .persona-card { position: relative; display: block; min-height: 159px; padding: 24px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; color: var(--text); text-align: left; background: linear-gradient(145deg, rgba(255,255,255,.065), rgba(255,255,255,.025)); cursor: pointer; transition: transform 200ms ease, border-color 200ms ease, background 200ms ease, box-shadow 200ms ease; }
      .persona-card::after { position: absolute; right: -20px; bottom: -55px; width: 120px; height: 120px; border-radius: 50%; content: ""; background: rgba(169,231,111,.07); filter: blur(20px); transition: opacity 200ms ease; opacity: 0; }

      .persona-card:hover::after { opacity: 1; }

      .chip { min-height: 44px; padding: 0 15px; border: 1px solid var(--line); border-radius: 99px; color: var(--muted); background: rgba(255,255,255,.025); cursor: pointer; font-size: 13px; transition: transform 180ms ease, color 180ms ease, border-color 180ms ease, background 180ms ease; }
      .chip:hover { color: var(--text); border-color: var(--line-strong); transform: translateY(-1px); }
      .chip.is-selected { color: #071000; border-color: var(--accent); background: var(--accent); animation: chip-pop 260ms cubic-bezier(.22,1,.36,1); }
      .chip.is-selected::before { display: inline-block; width: 0; margin-right: 0; content: "✓"; overflow: hidden; animation: check-in 240ms ease forwards; }
      .text-field, .text-area { width: 100%; border: 1px solid var(--line); border-radius: 8px; color: var(--text); background: rgba(255,255,255,.045); transition: border-color 180ms ease, background 180ms ease, box-shadow 180ms ease; }
      .text-field { height: 52px; padding: 0 15px; }

      .input-wrap { position: relative; }

      .brain-core { position: absolute; inset: 16px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 27px rgba(169,231,111,.45); animation: core-pulse 1.5s ease-in-out infinite; }

      .success-mark svg { width: 29px; height: 29px; stroke-dasharray: 42; stroke-dashoffset: 42; animation: draw-check 600ms 180ms ease forwards; }
      .decline-copy { max-width: 480px; margin-top: 22px; color: var(--muted); font-size: 16px; line-height: 1.65; }
      .decline-actions { display: flex; gap: 12px; margin-top: 38px; }
      .hidden { display: none !important; }

      @keyframes breathe { from { opacity: .65; transform: translateX(-50%) scale(.92); } to { opacity: 1; transform: translateX(-50%) scale(1.08); } }
      @keyframes view-in { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    ui.det.style.display = e.stack ? "" : "none";

 be replaced with the full CreatorOS AI privacy policy before launch.</div></details><div class="actions" data-testid="privacy-actions">' + button("Agree and continue", "agree", "privacy-agree-button", "primary", false, renderIcon("arrow")) + button("Decline", "decline", "privacy-decline-button", "quiet", false, "") + "</div></div></section>";

          if (state.persona === "product_builder") rows.push({ key: "Region", value: displayRegion() });
          if (state.persona === "advertiser") rows.splice(2, 0, { key: "Brand", value: a.brand_name });
          if (state.persona === "advertiser") rows.push({ key: "Budget", value: a.budget_range });
          var reviewRows = rows.map(function (row, index) { var formatted = formatReviewValue(row.value); return '<div class="review-row" data-testid="review-row-' + index + '"><span class="review-key" data-testid="review-key-' + index + '">' + escapeHtml(row.key) + '</span><span class="review-value' + (!formatted ? " empty" : "") + '" data-testid="review-value-' + index + '">' + escapeHtml(formatted || "Not added") + '</span></div>'; }).join("");
          var error = state.saveError ? '<p class="inline-error" data-testid="save-error" aria-live="assertive">' + escapeHtml(state.saveError) + '</p>' : "";
          return '<section class="view centered" data-testid="review-screen"><p class="eyebrow" data-testid="review-eyebrow">One last look</p><h2 data-testid="review-headline">Your starting point.</h2><p class="lede" data-testid="review-intro">This is the context we will use to make your first suggestions feel like yours.</p><div class="review-list" data-testid="review-list">' + reviewRows + "</div>" + error + '<div class="review-foot" data-testid="review-actions"><span class="preview-tag" data-testid="preview-mode-tag">' + (config.gatewayBaseUrl ? "Ready to save securely" : "Preview mode: nothing was saved") + '</span>' + button("Finish setup", "finish", "finish-setup-button", "primary", false, renderIcon("arrow")) + '</div><div style="margin-top: 14px">' + button("Back", "review-back", "review-back-button", "quiet", false, renderIcon("back")) + "</div></section>";
        }

        function renderSaving() { return '<section class="view centered saving" data-testid="saving-screen"><div><div class="brain" data-testid="brain-animation" aria-label="Setting up your Brain"><span class="brain-ring"></span><span class="brain-core"></span></div><p class="saving-copy" data-testid="saving-copy">Setting up your Brain</p></div></section>'; }
        function renderSuccess() { return '<section class="view centered" data-testid="success-screen"><div class="success-mark" data-testid="success-checkmark">' + renderIcon("check") + '</div><h2 data-testid="success-headline">You are ready to create.</h2><p class="lede" data-testid="success-copy">Your Brain is set up with a starting point that is uniquely yours. Let us make something useful.</p><div class="actions" data-testid="success-actions">' + (config.gatewayBaseUrl ? "" : '<span class="preview-tag" data-testid="success-preview-mode-tag">Preview mode: nothing was saved</span>') + button("Continue to CreatorOS", "complete", "success-complete-button", "primary", false, renderIcon("arrow")) + "</div></section>"; }

        function updateProgress() {
          var step = state.screen === "privacy" || state.screen === "declined" ? 1 : state.screen === "personas" ? 2 : state.screen === "question" ? 3 : 4;
          stepLabel.textContent = "Step " + step + " of 4";
          progressValue.style.width = (step * 25) + "%";
          progressTrack.setAttribute("aria-valuenow", String(step));
        }
        function render() {
          updateProgress();
          if (state.screen === "privacy") app.innerHTML = renderPrivacy();
          if (state.screen === "declined") app.innerHTML = renderDeclined();
          if (state.screen === "personas") app.innerHTML = renderPersonas();
          if (state.screen === "question") app.innerHTML = renderQuestion();
          if (state.screen === "review") app.innerHTML = renderReview();
          if (state.screen === "saving") app.innerHTML = renderSaving();
          if (state.screen === "success") app.innerHTML = renderSuccess();
          var firstInput = app.querySelector("input, textarea");
          if (firstInput && state.screen === "question") firstInput.focus();
        }
        function setQuestionError(message) { var node = document.getElementById("inline-error"); if (node) node.textContent = message || ""; }
        function updateQuestionButton() { var buttonNode = document.querySelector('[data-action="question-next"]'); if (buttonNode) buttonNode.disabled = !isAnswered(currentQuestion()); }
        function selectPersona(key) { state.persona = key; state.answers = blankAnswers(); state.questionIndex = 0; state.saveError = ""; state.screen = "question"; render(); }
        function buildPayload() {
          var a = state.answers;
          var extras = { consent: { accepted: true, policy_version: config.policyVersion, accepted_at: new Date().toISOString() }, goals_list: a.goals.slice() };
          if (state.persona === "product_builder") { extras.product_name = a.product_name; extras.product_description = a.product_description; extras.region = displayRegion(); }
          if (state.persona === "advertiser") { extras.brand_name = a.brand_name; extras.budget_range = a.budget_range; }
          return { persona: state.persona, display_name: a.display_name.trim(), niche: displayNiche(), tone: displayTone(), audience: a.audience.trim(), goals: a.goals.join(", "), platforms: a.platforms.slice(), extras: extras };
        }
        function callback(name, value) { try { if (typeof config[name] === "function") config[name](value); } catch (ignore) {} }
        async function saveProfile() {
          var payload = buildPayload();
          try {
            localStorage.setItem("creatoros_persona", payload.persona);
            localStorage.setItem("creatoros_onboarding", JSON.stringify(payload));
          } catch (storageErr) {
            console.warn("Could not save persona to localStorage:", storageErr);
          }
          if (window.CreatorAuth) {
            try {
              await window.CreatorAuth.saveOnboarding(payload.persona, payload);
            } catch (authSaveErr) {
              console.warn("[CreatorOS Auth] Could not save to Supabase:", authSaveErr && authSaveErr.message);
            }
          }
          if (!config.gatewayBaseUrl) {
            console.log(payload);
            callback("onComplete", payload);
            state.screen = "success";
            render();
            return;
          }
          var controller = new AbortController();
          var timeout = window.setTimeout(function () { controller.abort(); }, 15000);
          try {
            var token = await config.getAccessToken();
            var response = await fetch(String(config.gatewayBaseUrl).replace(/\/$/, "") + "/memory/profile", { method: "POST", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" }, body: JSON.stringify(payload), signal: controller.signal });
            var result = await response.json().catch(function () { return {}; });
            if (!response.ok || result.ok !== true) throw new Error("save_failed");
            callback("onComplete", payload);
            state.screen = "success";
            render();
          } catch (error) {
            state.saveError = error && error.name === "AbortError" ? "That took a little too long. Check your connection and try again." : "We could not save that just yet. Your answers are still here to try again.";
            state.screen = "review";
            render();
          } finally { window.clearTimeout(timeout); }
        }

        document.addEventListener("click", async function (event) {
          var target = event.target.closest("[data-action]");
          if (!target || target.disabled) return;
          var action = target.getAttribute("data-action");
          if (action === "agree") { state.screen = "personas"; render(); }
          else if (action === "decline") { state.screen = "declined"; render(); }
          else if (action === "review") { state.screen = "privacy"; render(); }
          else if (action === "leave") { callback("onDecline"); window.location.href = "index.html"; }
          else if (action === "persona") {
            var targetP = target.getAttribute("data-persona");
            if (urlParams.get("retake") === "true") {
              selectPersona(targetP);
            } else {
              launchPersonaDirectly(targetP);
            }
          }
          else if (action === "customize-persona") {
            selectPersona(target.getAttribute("data-persona"));
          }
          else if (action === "select-chip") { var chipKey = target.getAttribute("data-key"); state.answers[chipKey] = target.getAttribute("data-value"); render(); }
          else if (action === "toggle-multi") { var multiKey = target.getAttribute("data-key"); var multiValue = target.getAttribute("data-value"); var values = selectedValues(multiKey); state.answers[multiKey] = values.indexOf(multiValue) > -1 ? values.filter(function (item) { return item !== multiValue; }) : values.concat(multiValue); render(); }
          else if (action === "toggle-goal") { var goal = target.getAttribute("data-value"); var goals = selectedValues("goals"); if (goals.indexOf(goal) > -1) state.answers.goals = goals.filter(function (item) { return item !== goal; }); else if (goals.length < 3) state.answers.goals = goals.concat(goal); render(); }
          else if (action === "question-back") { if (state.questionIndex === 0) { state.screen = "personas"; } else state.questionIndex -= 1; render(); }
          else if (action === "question-next") { if (!isAnswered(currentQuestion())) { setQuestionError("Please answer this question to continue."); return; } if (state.questionIndex === personaQuestions[state.persona].length - 1) state.screen = "review"; else state.questionIndex += 1; render(); }
          else if (action === "review-back") { state.screen = "question"; state.questionIndex = personaQuestions[state.persona].length - 1; render(); }
          else if (action === "finish") { state.screen = "saving"; state.saveError = ""; render(); window.setTimeout(saveProfile, 850); }
          else if (action === "complete") {
            var payload = buildPayload();
            try {
              localStorage.setItem("creatoros_persona", payload.persona);
              localStorage.setItem("creatoros_onboarding", JSON.stringify(payload));
            } catch (storageErr) {
              console.warn("Could not save persona to localStorage:", storageErr);
            }
            if (window.CreatorAuth) {
              try {
                await window.CreatorAuth.saveOnboarding(payload.persona, payload);
              } catch (authSaveErr) {
                console.warn("[CreatorOS Auth] Could not save to Supabase:", authSaveErr && authSaveErr.message);
              }
            }
            callback("onComplete", payload);
            window.location.href = "index.html";
          }
        });
        document.addEventListener("input", function (event) {
          var input = event.target.closest("[data-input]");
          if (!input) return;
          var key = input.getAttribute("data-input");
          state.answers[key] = input.value;
          if (input.maxLength > 0) { var counter = document.getElementById("char-count"); if (counter) counter.textContent = input.value.length + "/" + input.maxLength; }
          updateQuestionButton();
          setQuestionError("");
        });
        render();
      }());
    </script>
